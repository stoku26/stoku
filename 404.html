<title>Faqja s'u gjet • Stoku</title>
<!-- GitHub Pages e shfaq këtë faqe (me statusin 404) për çdo adresë që s'ekziston te stoku.site, në çfarëdo dosjeje:
     prandaj krejt adresat këtu janë absolute ("/logo/…"), jo relative. -->
<link rel="icon" href="/logo/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="/logo/favicon-32.png?v=3" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<script src="/tema.js?v=238"></script>
<style>
  @font-face { font-family: 'Onest'; src: url('/fonts/onest.woff2') format('woff2'); font-weight: 400 800; font-style: normal; font-display: swap; }
  :root { --bg: #f6f5f2; --surface: #ffffff; --line: #e6e4df; --ink: #14161b; --muted: #6b6e76; --accent: #1f5fc4; --accent-press: #16479a; color-scheme: light; }
  :root[data-tema="dark"] { --bg: #0f1115; --surface: #171a20; --line: #2a2e36; --ink: #eceef2; --muted: #9ca1aa; --accent: #2f6fd8; --accent-press: #255bb8; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px;
  }
  .kuti { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 32px 24px 28px; text-align: center; }
  .logo { display: block; height: 44px; width: auto; margin: 0 auto 22px; }
  .logo-e-erret { display: none; }
  :root[data-tema="dark"] .logo-e-celet { display: none; }
  :root[data-tema="dark"] .logo-e-erret { display: block; }
  .kodi { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 13px; letter-spacing: 3px; color: var(--muted); margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 10px; }
  p { font-size: 15px; line-height: 1.5; color: var(--muted); margin: 0 0 22px; text-wrap: balance; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 28px;
    border-radius: 14px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; text-decoration: none;
  }
  .btn:hover, .btn:active { background: var(--accent-press); }
  .vete { font-size: 13px; margin: 16px 0 0; }
</style>
</head>
<body>
<main class="kuti">
  <img class="logo logo-e-celet" src="/logo/stoku-logo.svg?v=3" alt="Stoku" width="161" height="44">
  <img class="logo logo-e-erret" src="/logo/stoku-logo-dark.svg?v=3" alt="Stoku" width="161" height="44">
  <div class="kodi">404</div>
  <h1>Kjo faqe s'u gjet</h1>
  <p>Adresa që hape s'ekziston te Stoku. Mund të jetë një lidhje e vjetër ose e shkruar gabim.</p>
  <a class="btn" id="hapStokun" href="/">Hap Stoku-n</a>
  <p class="vete">Pas pak sekondash të çon vetë te Stoku.</p>
</main>
<script src="/faqja-404.js?v=238"></script>
</body>
</html>
