<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stoku</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stoku">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1565C0" id="metaTema">
<script>
  // Vendos temën para se faqja të vizatohet (që të mos ketë dridhje ndriçimi)
  (function () {
    var t = null;
    try { t = localStorage.getItem('stoku:tema'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-tema', t);
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --primar: #1565C0;
    --header: #1565C0;
    --rrezik: #B3261E;
    --tekst: #1c1b1f;
    --gri: #5f5f66;
    --vije: #e2e2e6;
    --sfond: #ffffff;
    --fushe-bg: #ffffff;
    --fushe-kufi: #79747e;
    --hover: #f2f4f8;
    --dialog: #ffffff;
    --dialog-tekst: #3b3b40;
    --btn-off-bg: #cfd3d9;
    --btn-off-tx: #8c9096;
    --btn-tekst: #1565C0;
    --toast-bg: #322f35;
    --toast-tx: #ffffff;
  }
  :root[data-tema="dark"] {
    color-scheme: dark;
    --header: #0f3f7a;
    --rrezik: #f2b8b5;
    --tekst: #e6e1e5;
    --gri: #a8a6ad;
    --vije: #38363b;
    --sfond: #141316;
    --fushe-bg: #1c1b20;
    --fushe-kufi: #8d8a93;
    --hover: #232227;
    --dialog: #2b2930;
    --dialog-tekst: #d0cdd4;
    --btn-off-bg: #3a393e;
    --btn-off-tx: #77757c;
    --btn-tekst: #8ab4f8;
    --toast-bg: #e6e1e5;
    --toast-tx: #1c1b1f;
  }

  /* Aksentet (ngjyra kryesore) */
  :root[data-aksent="jeshile"] { --primar: #2E7D32; --header: #2E7D32; --btn-tekst: #2E7D32; }
  :root[data-tema="dark"][data-aksent="jeshile"] { --header: #1b5e20; --btn-tekst: #81c995; }
  :root[data-aksent="vjollce"] { --primar: #6A1B9A; --header: #6A1B9A; --btn-tekst: #6A1B9A; }
  :root[data-tema="dark"][data-aksent="vjollce"] { --header: #4a148c; --btn-tekst: #ce93d8; }
  :root[data-aksent="portokalli"] { --primar: #E65100; --header: #E65100; --btn-tekst: #E65100; }
  :root[data-tema="dark"][data-aksent="portokalli"] { --header: #bf360c; --btn-tekst: #ffab40; }
  :root[data-aksent="kuqe"] { --primar: #C62828; --header: #C62828; --btn-tekst: #C62828; }
  :root[data-tema="dark"][data-aksent="kuqe"] { --header: #8e0000; --btn-tekst: #ef9a9a; }

  /* Madhësia e shkronjave: shkallëzon krejt faqen (edhe elementet me px) */
  body[data-madhesi="e_madhe"] { zoom: 1.12; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--tekst);
    background: var(--sfond);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overscroll-behavior: none;
  }
  header {
    background: var(--header);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  header h1.logo { font-weight: 800; letter-spacing: 3px; }
  #logoSlika { display: none; height: 34px; width: auto; flex: 1 1 auto; max-width: 170px; object-fit: contain; object-position: left center; }
  #btnMbrapa { flex: none; font-size: 22px; }
  .krye-butona { display: flex; gap: 8px; flex: none; }
  .btn-ikone {
    position: relative;
    flex: none;
    width: 42px; height: 42px;
    padding: 0;
    border: 0;
    border-radius: 21px;
    background: rgba(255,255,255,.18);
    color: #fff;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .btn-ikone:active { background: rgba(255,255,255,.3); }
  .btn-ikone.aktiv { background: rgba(255,255,255,.38); }
  /* vijë e pjerrët mbi ikonën e tastierës kur tastiera është e fshehur */
  #btnTastiera.aktiv::after {
    content: ''; position: absolute; left: 8px; right: 8px; top: 50%;
    height: 2.5px; margin-top: -1px; border-radius: 2px; background: #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.3); transform: rotate(-38deg);
  }
  .siper {
    padding: 12px 16px 4px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  label { display: block; font-size: 13px; color: var(--gri); margin: 0 0 4px 2px; }
  input[type="text"], input[type="search"], input[type="number"], input[type="password"] {
    width: 100%;
    height: 48px;
    font-size: 16px; /* 16px parandalon zoom-in automatik në iPhone */
    padding: 0 12px;
    border: 1px solid var(--fushe-kufi);
    border-radius: 8px;
    background: var(--fushe-bg);
    color: var(--tekst);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus { border-color: var(--btn-tekst); box-shadow: 0 0 0 1px var(--btn-tekst); }
  .rreshti { display: flex; gap: 8px; margin: 10px 0 6px; }

  /* Hapa sasie (+/-) */
  .sasia-hap { display: flex; align-items: stretch; gap: 8px; }
  .sasia-hap input { flex: 1; text-align: center; }
  .hap-btn {
    flex: none; width: 48px; height: 48px; border: 1px solid var(--fushe-kufi); border-radius: 8px;
    background: var(--fushe-bg); color: var(--tekst); font-size: 22px; font-weight: 600; line-height: 1;
    cursor: pointer;
  }
  .hap-btn:active { background: var(--hover); }

  /* Fusha e barkodit: kur tastiera është "e fshehur", vetë fusha zhvendoset jashtë ekranit
     (por mbetet e fokusuar, që skaneri i PDA-së të vazhdojë të shkruajë në të) dhe në vend të saj
     shfaqet një kuti e thjeshtë që tregon çfarë është shkruar deri tani. */
  .barkodi-mbeshtjellje { position: relative; }
  .barkodi-shfaqje {
    display: none;
    width: 100%; height: 48px; font-size: 16px; padding: 0 12px;
    border: 1px solid var(--fushe-kufi); border-radius: 8px;
    background: var(--fushe-bg); color: var(--tekst);
    align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    cursor: text;
  }
  .barkodi-mbeshtjellje.osk-fshehur #barkodi {
    position: fixed; left: -9999px; top: 0; width: 1px; height: 1px;
    padding: 0; border: 0; opacity: 0;
  }
  .barkodi-mbeshtjellje.osk-fshehur .barkodi-shfaqje { display: flex; }
  .btn {
    flex: 1;
    min-height: 46px;
    border: 0;
    border-radius: 23px;
    background: var(--primar);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    padding: 0 12px;
    cursor: pointer;
  }
  .btn:active { opacity: .85; }
  .btn:disabled { background: var(--btn-off-bg); color: var(--btn-off-tx); cursor: default; }
  .btn.tekst { background: transparent; color: var(--btn-tekst); flex: none; padding: 0 14px; }
  .btn.tekst.rrezik { color: var(--rrezik); }
  .btn.tekst:disabled { background: transparent; color: var(--btn-off-tx); }
  .btn.dyte { background: transparent; border: 1px solid var(--fushe-kufi); color: var(--tekst); }
  .fushe { margin-bottom: 8px; }
  #lista {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 16px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  .artikull {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--vije);
    cursor: pointer;
  }
  .artikull:active { background: var(--hover); }
  .artikull .majtas { flex: 1; min-width: 0; }
  .artikull .emri { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
  .artikull .emri.bosh { color: var(--gri); font-style: italic; font-weight: 400; }
  .artikull .kodi { font-size: 12px; color: var(--gri); margin-top: 2px; }
  .artikull .sasia { font-size: 22px; font-weight: 500; }
  .info { color: var(--gri); font-size: 14px; padding: 12px 2px; }

  /* Foldera */
  .folderat-rrjeti {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 4px 16px 16px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  .folder-karta {
    position: relative; border: 1px solid var(--vije); border-radius: 16px;
    padding: 16px 30px 16px 14px; background: var(--fushe-bg); cursor: pointer;
  }
  .folder-karta:active { background: var(--hover); }
  .folder-karta .emri { font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .folder-karta .numri { font-size: 13px; color: var(--gri); margin-top: 4px; }
  .folder-fshij {
    position: absolute; top: 6px; right: 6px; width: 30px; height: 30px;
    border: 0; border-radius: 15px; background: transparent; color: var(--gri);
    font-size: 17px; line-height: 1; cursor: pointer;
  }
  .folder-fshij:active { background: var(--vije); }
  footer {
    padding: 4px 16px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--vije);
    display: flex;
    justify-content: center;
  }

  /* Tips & Tricks (ekrani kryesor) */
  .tipi-mbeshtjellje {
    padding: 0 16px 16px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  .tipi-karta {
    border: 1px solid var(--vije); border-radius: 16px;
    background: var(--fushe-bg); padding: 14px 16px;
  }
  .tipi-krye { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .tipi-ikona { font-size: 18px; flex: none; line-height: 1; }
  .tipi-etiketa { font-weight: 600; font-size: 14px; flex: 1; }
  .tipi-mbyll {
    flex: none; border: 0; background: transparent; color: var(--gri);
    font-size: 16px; line-height: 1; cursor: pointer; padding: 4px;
  }
  .tipi-tekst { font-size: 14px; color: var(--dialog-tekst); margin: 0 0 8px; }
  .tipi-tjetri {
    border: 0; background: transparent; color: var(--btn-tekst);
    font-weight: 600; font-size: 13px; padding: 0; cursor: pointer;
  }

  /* Dialogët */
  .mbulese {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }
  .mbulese.hapur { display: flex; }
  .dialog {
    width: 100%; max-width: 380px;
    background: var(--dialog);
    color: var(--tekst);
    border-radius: 24px;
    padding: 22px 20px 12px;
    max-height: 90%;
    overflow-y: auto;
  }
  .dialog h2 { margin: 0 0 12px; font-size: 20px; font-weight: 600; }
  .dialog p { margin: 0 0 12px; font-size: 15px; white-space: pre-line; color: var(--dialog-tekst); }
  .dialog .kodi-dialog { font-size: 15px; margin-bottom: 12px; overflow-wrap: anywhere; white-space: pre-line; }
  .dialog .fushe { margin-bottom: 12px; }
  .veprime { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 4px; padding-top: 4px; }
  .hint { font-size: 13px; color: var(--gri); margin: 2px 0 12px; white-space: normal; }
  .zhvendos-nxit { display: block; width: 100%; text-align: left; padding: 6px 2px 14px; font-weight: 600; }
  #zhvendosLista { max-height: 320px; overflow-y: auto; margin: 4px 0 8px; }
  #zhvendosLista .kategori-rresht { font-weight: 500; }

  /* Opsionet */
  .dialog.opsione {
    max-width: 420px; padding: 0; display: flex; flex-direction: column;
    height: min(78vh, 620px);
  }
  .opsione-krye {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 20px 12px; flex: none;
  }
  .opsione-krye h2 { margin: 0; flex: 1; min-width: 0; }
  #opsPrapa {
    flex: none; width: 34px; height: 34px; border: 0; border-radius: 17px;
    background: var(--hover); color: var(--tekst); font-size: 18px; cursor: pointer;
  }
  .opsione-trup { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px; }
  .kategori-menu { padding: 4px 0 8px; }
  .kategori-rresht {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left; border: 0; background: transparent;
    color: var(--tekst); font-size: 16px; font-weight: 600;
    padding: 14px 2px; border-bottom: 1px solid var(--vije); cursor: pointer;
  }
  .kategori-rresht:active { background: var(--hover); }
  .kategori-rresht .shigjeta { color: var(--gri); font-weight: 400; font-size: 18px; }
  .opsione-faqet { padding: 4px 0 8px; }
  .opsione-faqe { display: none; }
  .opsione-faqe.aktiv { display: block; }
  .opsione-faqe .seksion:first-child { padding-top: 0; }
  .dialog.opsione .veprime {
    flex: none; padding: 10px 20px 16px; margin: 0; border-top: 1px solid var(--vije);
  }
  .seksion { padding: 12px 0; }
  .opsion-titull { font-size: 13px; font-weight: 700; color: var(--gri); margin-bottom: 8px; }
  .segment { display: flex; border: 1px solid var(--fushe-kufi); border-radius: 22px; overflow: hidden; }
  .segment button {
    flex: 1; min-height: 40px; border: 0; background: transparent; color: var(--tekst);
    font-size: 14px; font-weight: 600; cursor: pointer; padding: 0 6px;

  }
  .segment button + button { border-left: 1px solid var(--fushe-kufi); }
  .segment button.aktiv { background: var(--primar); color: #fff; }
  .aksent-rrjeti { display: flex; gap: 12px; flex-wrap: wrap; margin: 4px 0; }
  .aksent-rreth {
    width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent;
    cursor: pointer; padding: 0; position: relative;
  }
  .aksent-rreth[data-v="blu"] { background: #1565C0; }
  .aksent-rreth[data-v="jeshile"] { background: #2E7D32; }
  .aksent-rreth[data-v="vjollce"] { background: #6A1B9A; }
  .aksent-rreth[data-v="portokalli"] { background: #E65100; }
  .aksent-rreth[data-v="kuqe"] { background: #C62828; }
  .aksent-rreth.aktiv { border-color: var(--tekst); }
  .aksent-rreth.aktiv::after {
    content: '✓'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px; font-weight: 700;
  }
  label.opsion-rresht {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: 16px; color: var(--tekst); margin: 0; padding: 8px 0; cursor: pointer;
  }
  .ndez { position: relative; flex: none; width: 52px; height: 32px; }
  .ndez input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
  .ndez .pist { position: absolute; inset: 0; border-radius: 16px; background: var(--fushe-kufi); transition: background .15s; }
  .ndez .pist::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px;
    border-radius: 50%; background: #fff; transition: transform .15s;
  }
  .ndez input:checked + .pist { background: var(--primar); }
  .ndez input:checked + .pist::after { transform: translateX(20px); }
  select {
    width: 100%; height: 48px; font-size: 16px; padding: 0 36px 0 12px;
    border: 1px solid var(--fushe-kufi); border-radius: 8px;
    background-color: var(--fushe-bg); color: var(--tekst); outline: none;
    -webkit-appearance: none; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%23888' stroke-width='2'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center;
  }
  select:focus { border-color: var(--btn-tekst); box-shadow: 0 0 0 1px var(--btn-tekst); }

  /* Kamera */
  #kamera {
    position: fixed; inset: 0;
    background: #000;
    z-index: 30;
    display: none;
    flex-direction: column;
  }
  #kamera.hapur { display: flex; }
  .kamera-krye {
    display: flex; align-items: center; justify-content: space-between;
    color: #fff;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    gap: 12px;
    font-size: 15px;
  }
  .kamera-krye .btn { flex: none; min-height: 40px; background: #fff; color: #000; }
  .kamera-tekst { flex: 1; min-width: 0; }
  #kameraEmri { display: block; font-size: 12px; opacity: .75; margin-top: 2px; overflow-wrap: anywhere; }
  .kamera-veprime { display: flex; gap: 8px; flex: none; }
  .kamera-video-shtrat { position: relative; flex: 1; display: flex; }
  #reader { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; }
  #reader video { max-width: 100%; }
  .skan-mbulese {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none;
  }
  .skan-vije {
    width: min(78%, 300px); height: 2px;
    background: linear-gradient(90deg, transparent, #ff5252 12%, #ff5252 88%, transparent);
    box-shadow: 0 0 6px 1px rgba(255,82,82,.7);
  }
  .skan-hint {
    margin-top: 16px; color: #fff; background: rgba(0,0,0,.5);
    padding: 7px 16px; border-radius: 16px; font-size: 13px; text-align: center; max-width: 80%;
  }

  #toast {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: calc(80px + env(safe-area-inset-bottom));
    background: var(--toast-bg); color: var(--toast-tx);
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 14px;
    max-width: 90%;
    z-index: 40;
    display: none;
    text-align: center;
  }
  #toast.hapur { display: block; }
</style>
</head>
<body>

<header>
  <button id="btnMbrapa" class="btn-ikone" type="button" style="display:none">←</button>
  <h1 id="titulli" class="logo">STOKU</h1>
  <img id="logoSlika" src="logo.png" alt="Stoku">
  <div class="krye-butona">
    <button id="btnTastiera" class="btn-ikone" type="button">⌨️</button>
    <button id="btnOpsione" class="btn-ikone" type="button" aria-label="Opsionet / Options" title="Opsionet / Options">⚙️</button>
  </div>
</header>

<!-- Lista e folderave -->
<div class="siper" id="siperFolderat">
  <button class="btn" id="btnKrijoFolder" type="button" style="width:100%"></button>
</div>
<div id="folderaLista" class="folderat-rrjeti"></div>

<!-- Tips & Tricks -->
<div class="tipi-mbeshtjellje" id="tipiMbeshtjellje">
  <div class="tipi-karta">
    <div class="tipi-krye">
      <span class="tipi-ikona" aria-hidden="true">💡</span>
      <span class="tipi-etiketa" id="tipiEtiketa"></span>
      <button type="button" class="tipi-mbyll" id="tipiMbyll">✕</button>
    </div>
    <div class="tipi-tekst" id="tipiTeksti"></div>
    <button type="button" class="tipi-tjetri" id="tipiTjetri"></button>
  </div>
</div>

<!-- Brenda një folderi -->
<div class="siper" id="siperFolderi" style="display:none">
  <div class="fushe">
    <label for="barkodi" id="lblBarkodi"></label>
    <div class="barkodi-mbeshtjellje" id="barkodiMbeshtjellje">
      <input id="barkodi" type="text" inputmode="numeric" enterkeyhint="done"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="barkodi-shfaqje" id="barkodiShfaqje" tabindex="0"></div>
    </div>
  </div>
  <div class="rreshti">
    <button class="btn" id="btnKamera" type="button"></button>
    <button class="btn" id="btnEksport" type="button"></button>
  </div>

  // ================= Baza (localStorage): foldera + produkte =================
  var KEY_FOLDERA = 'stoku:foldera:v1';
  var KEY_PRODUKTET = 'stoku:produktet:v2';
  var KEY_PRODUKTET_VJETER = 'stoku:produktet:v1'; // pa foldera, versioni i vjetër
  var LIMIT_RENDER = 300;
  var MIME_XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

  var FOLDERAT_PARAZGJEDHUR = [
    { id: 'ushqimore', emri: 'Ushqimore' },
    { id: 'pije', emri: 'Pije' },
    { id: 'higjiene', emri: 'Higjiene' },
    { id: 'fresh', emri: 'Fresh' }
  ];

  var foldera = [];          // [{ id, emri }, ...]
  var produktet = {};        // çelësi: kategoriaId + '::' + barkodi
  var folderiAktual = null;  // id i folderit të hapur, ose null = lista e folderave

  function celesiProduktit(kategoriaId, barkodi) { return kategoriaId + '::' + barkodi; }

  function emriFolderit(id) {
    var f = foldera.filter(function (x) { return x.id === id; })[0];
    return f ? f.emri : '';
  }

  function produktetENjeFolderi(kategoriaId) {
    return Object.keys(produktet)
      .map(function (k) { return produktet[k]; })
      .filter(function (p) { return p.kategoriaId === kategoriaId; });
  }

  function ngarkoBazen() {
    var f = null, p = null;
    try { f = JSON.parse(localStorage.getItem(KEY_FOLDERA) || 'null'); } catch (e) { /* ok */ }
    try { p = JSON.parse(localStorage.getItem(KEY_PRODUKTET) || 'null'); } catch (e) { /* ok */ }

    if (Array.isArray(f) && p && typeof p === 'object') {
      foldera = f;
      produktet = p;
      return;
    }

    // S'ka të dhëna me foldera ende: fillo me folderat e parazgjedhur
    foldera = FOLDERAT_PARAZGJEDHUR.map(function (fo) { return { id: fo.id, emri: fo.emri }; });
    produktet = {};

    // Migro të dhëna të vjetra (para se aplikacioni të kishte foldera), nëse ka
    var vjeter = null;
    try { vjeter = JSON.parse(localStorage.getItem(KEY_PRODUKTET_VJETER) || 'null'); } catch (e) { /* ok */ }
    if (vjeter && typeof vjeter === 'object' && Object.keys(vjeter).length > 0) {
      var kidVjeter = 'pa-kategori';
      foldera.push({ id: kidVjeter, emri: 'Pa kategori' });
      Object.keys(vjeter).forEach(function (b) {
        var pr = vjeter[b];
        if (!pr || typeof pr.barkodi !== 'string') return;
        produktet[celesiProduktit(kidVjeter, pr.barkodi)] = {
          barkodi: pr.barkodi, emri: pr.emri || '', sasia: pr.sasia | 0, kategoriaId: kidVjeter
        };
      });
    }

    ruajBaze();
  }

  function ruajBaze() {
    try {
      localStorage.setItem(KEY_FOLDERA, JSON.stringify(foldera));
      localStorage.setItem(KEY_PRODUKTET, JSON.stringify(produktet));
      planifikoSinkronizimin();
      return true;
    } catch (e) {
      toast(T('ruajtjaDeshtoi'));
      return false;
    }
  }

  ngarkoBazen();

  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) { /* nuk ka problem */ }

  // ---------- Toast ----------

    var t = $('toast');
    t.textContent = mesazh;
    t.classList.add('hapur');

  // ================= Opsionet (përfshirë gjuha) =================
  var KEY_OPSIONE = 'stoku:opsione:v1';
  var KEY_TEMA = 'stoku:tema';

  var opsione = {
    tingull: true, rendi: 'i_ri', scanner: true, pda: false, tastieraEFshehur: false,
    paEmer: false, kameraId: '', autofokus: true, gjuha: 'sq', aksent: 'blu', madhesia: 'normale'
  };
  try {
    var opsioneRuajtura = JSON.parse(localStorage.getItem(KEY_OPSIONE) || 'null');
    if (opsioneRuajtura && typeof opsioneRuajtura === 'object') {
      if (typeof opsioneRuajtura.tingull === 'boolean') opsione.tingull = opsioneRuajtura.tingull;
      if (typeof opsioneRuajtura.scanner === 'boolean') opsione.scanner = opsioneRuajtura.scanner;
      if (typeof opsioneRuajtura.pda === 'boolean') opsione.pda = opsioneRuajtura.pda;
      if (typeof opsioneRuajtura.paEmer === 'boolean') opsione.paEmer = opsioneRuajtura.paEmer;

      if (typeof opsioneRuajtura.tastieraEFshehur === 'boolean') opsione.tastieraEFshehur = opsioneRuajtura.tastieraEFshehur;
      if (['i_ri', 'emri', 'emriZA', 'sasiaUlet', 'sasiaLart'].indexOf(opsioneRuajtura.rendi) !== -1) opsione.rendi = opsioneRuajtura.rendi;
      if (opsioneRuajtura.gjuha === 'en' || opsioneRuajtura.gjuha === 'sq') opsione.gjuha = opsioneRuajtura.gjuha;
      if (['blu', 'jeshile', 'vjollce', 'portokalli', 'kuqe'].indexOf(opsioneRuajtura.aksent) !== -1) opsione.aksent = opsioneRuajtura.aksent;
      if (opsioneRuajtura.madhesia === 'e_madhe' || opsioneRuajtura.madhesia === 'normale') opsione.madhesia = opsioneRuajtura.madhesia;
    }
  } catch (e) { /* përdor vlerat fillestare */ }

  // Migrim një herë: telefonat që ende ishin te rendi i vjetër i parazgjedhur ('emri') kalojnë
  // te "më të rejat së pari", siç kërkohet tani si sjellje e parazgjedhur.
  try {
    if (!localStorage.getItem('stoku:rendi-migruar-v1')) {
      if (!opsioneRuajtura || opsioneRuajtura.rendi === 'emri' || !opsioneRuajtura.rendi) opsione.rendi = 'i_ri';

  // ---------- Foldera ----------
  function renderFolderat() {
    var cont = $('folderaLista');
    cont.textContent = '';
    var frag = document.createDocumentFragment();
    foldera.forEach(function (f) {
      var n = produktetENjeFolderi(f.id).length;

      var karta = document.createElement('div');
      karta.className = 'folder-karta';

      var emri = document.createElement('div');
      emri.className = 'emri';
      emri.textContent = f.emri;

      var numri = document.createElement('div');
      numri.className = 'numri';
      numri.textContent = T('njesiaProdukteve', { n: n });

      karta.appendChild(emri);
      karta.appendChild(numri);
      karta.addEventListener('click', function () { hapFolderin(f.id); });

      var fshij = document.createElement('button');
      fshij.type = 'button';
      fshij.className = 'folder-fshij';
      fshij.setAttribute('aria-label', T('fshij') + ' ' + f.emri);
      fshij.title = T('fshij');
      fshij.textContent = '✕';
      fshij.addEventListener('click', function (ev) {
        ev.stopPropagation();
        fshijFolderin(f);
      });
      karta.appendChild(fshij);

      frag.appendChild(karta);
    });
    cont.appendChild(frag);
  }

    var emri = $('dlgFolderEmri').value.trim();

    var id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  // Fshirja e një folderi (bashkë me produktet brenda tij)
  async function fshijFolderin(f) {
    var brenda = produktetENjeFolderi(f.id);
    var mesazhi = brenda.length > 0
      ? T('folderiMePrTekst', { emri: f.emri, n: brenda.length })
      : T('folderiBoshTekst', { emri: f.emri });
    var po = await konfirmo(T('teFshihetFolderi'), mesazhi, T('fshij'));
    if (!po) return;
    foldera = foldera.filter(function (x) { return x.id !== f.id; });
    brenda.forEach(function (p) { delete produktet[celesiProduktit(f.id, p.barkodi)]; });
    shenoFolderinEFshire(f.id);
    brenda.forEach(function (p) { shenoProduktinEFshire(celesiProduktit(f.id, p.barkodi)); });
    ruajBaze();
    renderFolderat();
  }

  // Tema: 'auto' (ndjek telefonin), 'light' ose 'dark'
  function zgjedhjaETemes() {
    var t = null;
    try { t = localStorage.getItem(KEY_TEMA); } catch (e) { /* ok */ }
    return (t === 'dark' || t === 'light') ? t : 'auto';
  }
  function temaEfektive() {
    var z = zgjedhjaETemes();
    if (z !== 'auto') return z;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function zbatoTemen() {
    var t = temaEfektive();
    document.documentElement.setAttribute('data-tema', t);
    $('metaTema').setAttribute('content', t === 'dark' ? '#0f3f7a' : '#1565C0');
    var z = zgjedhjaETemes();
    Array.prototype.forEach.call(document.querySelectorAll('#segTema button'), function (b) {
      b.classList.toggle('aktiv', b.getAttribute('data-v') === z);
    });
  }
  function vendosTemen(v) {
    try {
      if (v === 'auto') localStorage.removeItem(KEY_TEMA); else localStorage.setItem(KEY_TEMA, v);
    } catch (e) { /* ok */ }
    zbatoTemen();
  }
  if (window.matchMedia) {
    var mqErret = window.matchMedia('(prefers-color-scheme: dark)');
    var kurNdryshonTelefoni = function () { if (zgjedhjaETemes() === 'auto') zbatoTemen(); };
    if (mqErret.addEventListener) mqErret.addEventListener('change', kurNdryshonTelefoni);
    else if (mqErret.addListener) mqErret.addListener(kurNdryshonTelefoni);
  }
  zbatoTemen();

    document.documentElement.setAttribute('data-aksent', opsione.aksent === 'blu' ? '' : opsione.aksent);
    Array.prototype.forEach.call(document.querySelectorAll('#aksentRrjeti button'), function (b) {
      b.classList.toggle('aktiv', b.getAttribute('data-v') === opsione.aksent);
    });

    ruajOpsionet();
    zbatoAksentin();

  Array.prototype.forEach.call(document.querySelectorAll('#aksentRrjeti button'), function (b) {

  // Rifreskon krejt tekstin e dukshëm kur ndryshon gjuha (pa mbyllur asnjë dritare të hapur)
  function perkthoGjithcka() {
    perkthoStatiket();
    zbatoGjuhen();

    renderTipin();
    if (folderiAktual === null) {

    if ($('dlgOpsione').classList.contains('hapur')) {

      aktivizoTabin(faqjaAktive ? faqjaAktive.getAttribute('data-faqe') : null);

  // Rendi i listës
  function emriKrahaso(a, b) {
    if (!a.emri && !b.emri) return a.barkodi.localeCompare(b.barkodi);
    if (!a.emri) return 1;
    if (!b.emri) return -1;
    return a.emri.localeCompare(b.emri, 'sq', { sensitivity: 'base' }) || a.barkodi.localeCompare(b.barkodi);
  }
  function krahaso(a, b) {
    if (opsione.rendi === 'sasiaUlet') return (a.sasia - b.sasia) || emriKrahaso(a, b);
    if (opsione.rendi === 'sasiaLart') return (b.sasia - a.sasia) || emriKrahaso(a, b);
    if (opsione.rendi === 'emriZA') return -emriKrahaso(a, b);
    if (opsione.rendi === 'i_ri') return ((b.prekurSe || 0) - (a.prekurSe || 0)) || emriKrahaso(a, b);
    return emriKrahaso(a, b);
  }

  function zbatoPda() {
    var pda = opsione.pda;
    $('btnKamera').style.display = pda ? 'none' : '';
    $('btnEksportPdf').style.display = ''; // PDF mbetet e dukshme edhe në PDA
    $('rreshtTingull').style.display = pda ? 'none' : '';

  // Bllokon rrotullimin e ekranit (vetëm portret) kur PDA është ndezur; e liron kur fiket.
  // Në heshtje krejt: pa asnjë mesazh apo opsion, thjesht provon dhe injoron nëse shfletuesi s'e lejon.
  function zbatoRrotullimin() {
    try {
      if (opsione.pda) {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('portrait').catch(function () { /* s'lejohet këtu, injoro */ });
        }
      } else if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    } catch (e) { /* shfletuesi nuk e mbështet, injoro në heshtje */ }
  }

  // Kthen kursorin te fusha e barkodit (vetëm në modalitetin PDA, dhe vetëm nëse nuk ka dritare të hapur)
  function fokusoBarkodin() {
    if (!opsione.pda) return;
    if (folderiAktual === null) return;
    if (document.querySelector('.mbulese.hapur')) return;
    $('barkodi').focus();

      // e mban fokusin te fusha e vërtetë (jashtë ekranit), që skaneri i PDA-së të vazhdojë të shkruajë në të;
      // fokusi i dhënë nga kodi (jo nga një prekje e drejtpërdrejtë) zakonisht NUK e hap tastierën në ekran
      $('barkodi').focus();

    toast(opsione.tastieraEFshehur ? T('tastieraFshehur') : T('tastieraShfaqet'));
  });
  $('opsPaEmer').addEventListener('change', async function () {
    if (!$('opsPaEmer').checked) {          // fikja nuk kërkon paralajmërim
      opsione.paEmer = false;
      ruajOpsionet();
      return;
    }
    $('opsPaEmer').checked = false;          // ndizet vetëm pasi ta pranosh paralajmërimin
    var po = await konfirmo(T('paEmerKonfTitulli'), T('paEmerKonfTekst'), T('aktivizo'), 5);
    if (po) {
      opsione.paEmer = true;
      $('opsPaEmer').checked = true;
      ruajOpsionet();
    }
  });
  $('opsKamera').addEventListener('change', function () {
    opsione.kameraId = $('opsKamera').value;
    ruajOpsionet();
  });
  $('opsKameraGjej').addEventListener('click', async function () {
    var btn = $('opsKameraGjej');
    btn.disabled = true;
    await plotesoKamerat(true);   // kërkon lejen e kamerës nëse ende s'është dhënë
    btn.disabled = false;

  $('opsAutofokus').addEventListener('change', function () {
    opsione.autofokus = $('opsAutofokus').checked;
    ruajOpsionet();

  $('opsRendi').addEventListener('change', function () {
    opsione.rendi = $('opsRendi').value;

    renderLista();

  // Konfirmim i përgjithshëm (kthen Promise me true/false)
  var konfRez = null;
  var konfKohez = null;
  // vonesa (opsionale) = sekonda para se butoni i pranimit aktivizohet
  function konfirmo(titulli, teksti, butoni, vonesa) {
    return new Promise(function (zgjidh) {
      $('konfTitulli').textContent = titulli;
      $('konfTekst').textContent = teksti;
      var btn = $('konfPo');
      clearInterval(konfKohez);
      if (vonesa > 0) {
        var s = vonesa;
        btn.disabled = true;
        btn.textContent = butoni + ' (' + s + ')';
        konfKohez = setInterval(function () {
          s--;
          if (s > 0) {
            btn.textContent = butoni + ' (' + s + ')';
          } else {
            clearInterval(konfKohez);
            btn.disabled = false;
            btn.textContent = butoni;
          }
        }, 1000);
      } else {
        btn.disabled = false;
        btn.textContent = butoni;
      }
      konfRez = zgjidh;
      $('dlgKonfirmo').classList.add('hapur');
    });
  }
  function mbyllKonfirmo(vlera) {
    clearInterval(konfKohez);
    $('dlgKonfirmo').classList.remove('hapur');
    fokusoBarkodin();
    if (konfRez) { var r = konfRez; konfRez = null; r(vlera); }
  }
  $('konfPo').addEventListener('click', function () { mbyllKonfirmo(true); });
  $('konfJo').addEventListener('click', function () { mbyllKonfirmo(false); });
  $('dlgKonfirmo').addEventListener('click', function (ev) {
    if (ev.target === $('dlgKonfirmo')) mbyllKonfirmo(false);
  });

  // ================= Cloud (Firebase) — kopje automatike online =================
  var SINKRONIZIM_VONESA_MS = 1500; // pak kohë pas ndryshimit, që skanimet e shpejta rresht të bashkohen në një kërkesë
  var sinkronizoKohezi = null;
  var dukeSinkronizuar = false;
  var dukeRikthyerNgaCloud = false;
  var dukeRregjistruarApoHyrje = false;

  function emriEshteVlefshem(v) { return typeof v === 'string' && /^[a-zA-Z0-9_.-]{3,}$/.test(v.trim()); }
  function fjalekalimiEshteVlefshem(v) { return typeof v === 'string' && v.length >= 6; }

  // Regjistri i fshirjeve (lokal): mban mend cilat produkte/foldera janë fshi QËLLIMISHT këtu
  // (fshirje e vetme, fshirje krejt, fshirje folderi, ose zhvendosje — çelësi i vjetër fshihet), që
  // sinkronizimi t'i heqë ato nga cloud-i, por asnjëherë të mos heqë diçka që thjesht "mungon"
  // lokalisht pa qenë fshi qëllimisht (p.sh. të dhëna lokale të pjesshme a të humbura pa dashje).
  var KEY_FSHIRE = 'stoku:fshira:v1';
  var fshira = { produktet: {}, foldera: {} };
  function ngarkoFshiraet() {
    try {
      var t = JSON.parse(localStorage.getItem(KEY_FSHIRE) || 'null');
      if (t && typeof t === 'object') {
        fshira.produktet = (t.produktet && typeof t.produktet === 'object') ? t.produktet : {};
        fshira.foldera = (t.foldera && typeof t.foldera === 'object') ? t.foldera : {};
      }
    } catch (e) { /* ok */ }
  }
  function ruajFshiraet() {
    try { localStorage.setItem(KEY_FSHIRE, JSON.stringify(fshira)); } catch (e) { /* ok */ }
  }
  function shenoProduktinEFshire(celesi) { fshira.produktet[celesi] = Date.now(); ruajFshiraet(); }
  function shenoFolderinEFshire(id) { fshira.foldera[id] = Date.now(); ruajFshiraet(); }
  ngarkoFshiraet();

  function gjendjaPerCloud() {
    return {
      app: 'stoku', version: 2, koha: new Date().toISOString(),
      foldera: foldera,
      produktet: Object.keys(produktet).map(function (k) { return produktet[k]; })
    };
  }

  // Bashkon të dhënat lokale me ato ekzistuese në cloud: shton/përditëson gjithmonë, dhe heq nga
  // cloud-i VETËM ato produkte/foldera që janë shënuar si fshi qëllimisht këtu (shih «fshira» më
  // lart) — çdo gjë tjetër që ekziston në cloud por jo lokalisht (pa u fshi qëllimisht) mbetet.
  function bashkoPaFshirje(gjendjaCloud, gjendjaLokale) {
    var folderaMap = {};
    (Array.isArray(gjendjaCloud.foldera) ? gjendjaCloud.foldera : []).forEach(function (f) {
      if (f && f.id) folderaMap[f.id] = f;
    });
    (Array.isArray(gjendjaLokale.foldera) ? gjendjaLokale.foldera : []).forEach(function (f) {
      if (f && f.id) folderaMap[f.id] = f;
    });
    var folderaLokaleIds = {};
    (Array.isArray(gjendjaLokale.foldera) ? gjendjaLokale.foldera : []).forEach(function (f) {
      if (f && f.id) folderaLokaleIds[f.id] = true;
    });
    Object.keys(fshira.foldera).forEach(function (id) {
      if (!folderaLokaleIds[id]) delete folderaMap[id];
    });

    var produktetMap = {};
    (Array.isArray(gjendjaCloud.produktet) ? gjendjaCloud.produktet : []).forEach(function (p) {
      if (p && typeof p.barkodi === 'string' && typeof p.kategoriaId === 'string') {
        produktetMap[celesiProduktit(p.kategoriaId, p.barkodi)] = p;
      }
    });
    (Array.isArray(gjendjaLokale.produktet) ? gjendjaLokale.produktet : []).forEach(function (p) {
      if (p && typeof p.barkodi === 'string' && typeof p.kategoriaId === 'string') {
        produktetMap[celesiProduktit(p.kategoriaId, p.barkodi)] = p;
      }
    });
    var produktetLokaleKeys = {};
    (Array.isArray(gjendjaLokale.produktet) ? gjendjaLokale.produktet : []).forEach(function (p) {
      if (p && typeof p.barkodi === 'string' && typeof p.kategoriaId === 'string') {
        produktetLokaleKeys[celesiProduktit(p.kategoriaId, p.barkodi)] = true;
      }
    });
    Object.keys(fshira.produktet).forEach(function (k) {
      if (!produktetLokaleKeys[k]) delete produktetMap[k];
    });

    return {
      app: 'stoku', version: 2, koha: new Date().toISOString(),
      foldera: Object.keys(folderaMap).map(function (id) { return folderaMap[id]; }),
      produktet: Object.keys(produktetMap).map(function (k) { return produktetMap[k]; })
    };
  }

  function vendosStatusinCloud(teksti) {
    var el = $('cloudStatusi');
    if (el) el.textContent = teksti;
  }

  function oraTani() {
    var d = new Date();
    return dyShifra(d.getHours()) + ':' + dyShifra(d.getMinutes());
  }

  function perdoruesiAktual() {
    return (window.__stokuCloud && window.__stokuCloud.perdoruesiAktual) ? window.__stokuCloud.perdoruesiAktual() : null;
  }

  function emriPerdoruesitAktual() {
    var u = perdoruesiAktual();
    if (!u || typeof u.email !== 'string') return '';
    return u.email.split('@')[0];
  }

  // Sinkronizon menjëherë pas çdo shtimi/ndryshimi/fshirjeje të një produkti (me vonesë të vogël,
  // që disa skanime rresht të mos dërgojnë çdo herë një kërkesë të veçantë).
  function planifikoSinkronizimin() {
    if (!perdoruesiAktual()) return;
    clearTimeout(sinkronizoKohezi);
    sinkronizoKohezi = setTimeout(kryeSinkronizimin, SINKRONIZIM_VONESA_MS);
  }

  async function kryeSinkronizimin() {
    if (!perdoruesiAktual() || !window.__stokuCloud) return;
    clearTimeout(sinkronizoKohezi);
    dukeSinkronizuar = true;
    vendosStatusinCloud(T('cloudStatusiDukeSink'));
    var meparshme = await window.__stokuCloud.merr();
    var perDergim = gjendjaPerCloud();
    if (meparshme.ok && meparshme.gjendja) {
      perDergim = bashkoPaFshirje(meparshme.gjendja, perDergim);
    }
    var rez = await window.__stokuCloud.ruaj(perDergim);
    dukeSinkronizuar = false;
    if (rez.ok) {
      // Fshirjet e shënuara tashmë u zbatuan te cloud-i në këtë sinkronizim; s'ka nevojë t'i mbajmë më.
      fshira = { produktet: {}, foldera: {} };
      ruajFshiraet();
    }
    vendosStatusinCloud(rez.ok ? T('cloudStatusiUSink', { kur: oraTani() }) : T('cloudStatusiDeshtoi'));
  }

  function zbatoGjendjenNgaCloud(te) {
    var arrF = Array.isArray(te.foldera) && te.foldera.length > 0
      ? te.foldera
      : FOLDERAT_PARAZGJEDHUR.map(function (fo) { return { id: fo.id, emri: fo.emri }; });
    var produktetENoja = {};
    (Array.isArray(te.produktet) ? te.produktet : []).forEach(function (p) {
      if (p && typeof p.barkodi === 'string' && typeof p.kategoriaId === 'string') {
        produktetENoja[celesiProduktit(p.kategoriaId, p.barkodi)] = p;
      }
    });
    foldera = arrF;
    produktet = produktetENoja;
    folderiAktual = null;
    ruajBaze();
    rifreskoPamjen();
  }

  // Ekzekutohet një herë për çdo hyrje/sesion: bashkon të dhënat e cloud-it me ato lokale (pa fshi
  // asgjë lokalisht — shih bashkoPaFshirje), pastaj sinkronizon prapë për të pajtuar krejt anët.
  var __uidISinkronizuarDarePasHyrjes = null;
  async function sinkronizoNeHyrje() {
    var u = perdoruesiAktual();
    if (!u || !window.__stokuCloud) return;
    if (__uidISinkronizuarDarePasHyrjes === u.uid) return; // e ba tashmë për këtë hyrje
    __uidISinkronizuarDarePasHyrjes = u.uid;
    vendosStatusinCloud(T('cloudStatusiDukeSink'));
    var rez = await window.__stokuCloud.merr();
    if (rez.ok && rez.gjendja) {
      var bashkuar = bashkoPaFshirje(rez.gjendja, gjendjaPerCloud());
      zbatoGjendjenNgaCloud(bashkuar);
    }
    kryeSinkronizimin();
  }

  function rifreskoDukjenECloud() {
    var u = perdoruesiAktual();
    $('cloudHyrjeSeksion').style.display = u ? 'none' : '';
    $('cloudBrendaSeksion').style.display = u ? '' : 'none';
    if (u) {
      $('cloudHyrePerTeksti').textContent = T('cloudHyrePerTeksti', { emri: emriPerdoruesitAktual() });
      if (!dukeSinkronizuar && !dukeRikthyerNgaCloud) vendosStatusinCloud(T('cloudStatusiAsgje'));
    } else {
      $('cloudGabimHint').textContent = '';
    }
  }
  rifreskoDukjenECloud();

  window.addEventListener('stoku-cloud-gati', function () {
    rifreskoDukjenECloud();
    sinkronizoNeHyrje();
  });
  window.addEventListener('stoku-auth-ndryshoi', function () {
    if (!perdoruesiAktual()) __uidISinkronizuarDarePasHyrjes = null;
    rifreskoDukjenECloud();
    sinkronizoNeHyrje();
  });
  if (window.__stokuCloud) { rifreskoDukjenECloud(); sinkronizoNeHyrje(); }

  function tekstiGabimitCloud(kodi) {
    if (kodi === 'auth/email-already-in-use') return T('cloudLlogariaEkziston');
    if (kodi === 'auth/invalid-credential' || kodi === 'auth/wrong-password' || kodi === 'auth/user-not-found') return T('cloudHyrjeGabim');
    if (kodi === 'auth/weak-password') return T('cloudFjalekalimiIShkurter');
    if (kodi === 'auth/requires-recent-login') return T('cloudDuhetRihyrje');
    return T('cloudGabimPergjithshem');
  }

  async function kryeRregjistrimHyrje(regjistrim, idUsername, idFjalekalimi, idGabim) {
    if (dukeRregjistruarApoHyrje || !window.__stokuCloud) return;
    idUsername = idUsername || 'cloudUsername';
    idFjalekalimi = idFjalekalimi || 'cloudFjalekalimi';
    idGabim = idGabim || 'cloudGabimHint';
    var emri = $(idUsername).value.trim();
    var fjalekalimi = $(idFjalekalimi).value;
    if (!emri || !fjalekalimi) { $(idGabim).textContent = T('cloudPlotesoFushat'); return; }
    if (!emriEshteVlefshem(emri)) { $(idGabim).textContent = T('cloudEmriIShkurter'); return; }
    if (!fjalekalimiEshteVlefshem(fjalekalimi)) { $(idGabim).textContent = T('cloudFjalekalimiIShkurter'); return; }
    $(idGabim).textContent = '';
    dukeRregjistruarApoHyrje = true;
    var rez = regjistrim
      ? await window.__stokuCloud.regjistrohu(emri, fjalekalimi)
      : await window.__stokuCloud.hyr(emri, fjalekalimi);
    dukeRregjistruarApoHyrje = false;
    if (!rez.ok) {
      $(idGabim).textContent = tekstiGabimitCloud(rez.kodi);
      return;
    }
    $(idFjalekalimi).value = '';
    rifreskoDukjenECloud();
    toast(T(regjistrim ? 'cloudLlogariaUKrijua' : 'cloudHyrjaUKry'));
    sinkronizoNeHyrje();
  }

  $('cloudKrijoLlogari').addEventListener('click', function () { kryeRregjistrimHyrje(true, 'cloudUsername', 'cloudFjalekalimi', 'cloudGabimHint'); });
  $('cloudHyrBtn').addEventListener('click', function () { kryeRregjistrimHyrje(false, 'cloudUsername', 'cloudFjalekalimi', 'cloudGabimHint'); });

  $('cloudSinkronizoTani').addEventListener('click', function () { kryeSinkronizimin(); });

  $('cloudRiktheTani').addEventListener('click', async function () {
    if (!perdoruesiAktual() || !window.__stokuCloud) return;
    dukeRikthyerNgaCloud = true;
    vendosStatusinCloud(T('cloudStatusiDukeRikthyer'));
    var rez = await window.__stokuCloud.merr();
    dukeRikthyerNgaCloud = false;
    if (!rez.ok || !rez.gjendja) {
      vendosStatusinCloud(T('cloudStatusiAsgje'));
      toast(T('cloudNukKaAsgje'));
      return;
    }
    var aktual = Object.keys(produktet).length;
    var po = await konfirmo(T('cloudTeRiktheteCloud'), T('cloudRiktheTekst', { aktual: aktual }), T('rikthe'));
    if (!po) { rifreskoDukjenECloud(); return; }
    zbatoGjendjenNgaCloud(rez.gjendja);
    toast(T('cloudURikthye'));
    vendosStatusinCloud(T('cloudStatusiUSink', { kur: oraTani() }));
  });

  $('cloudNdryshoEmrin').addEventListener('click', async function () {
    if (!window.__stokuCloud || !window.__stokuCloud.ndryshoEmrin) return;
    var emriRi = $('cloudEmriRi').value.trim();
    if (!emriRi) { $('cloudNdryshoGabimHint').textContent = T('cloudPlotesoEmrinRi'); return; }
    if (!emriEshteVlefshem(emriRi)) { $('cloudNdryshoGabimHint').textContent = T('cloudEmriIShkurter'); return; }
    $('cloudNdryshoGabimHint').textContent = '';
    var rez = await window.__stokuCloud.ndryshoEmrin(emriRi);
    if (!rez.ok) { $('cloudNdryshoGabimHint').textContent = tekstiGabimitCloud(rez.kodi); return; }
    $('cloudEmriRi').value = '';
    rifreskoDukjenECloud();
    toast(T('cloudEmriURiNdryshuar'));
  });

  $('cloudNdryshoFjalekalimin').addEventListener('click', async function () {
    if (!window.__stokuCloud || !window.__stokuCloud.ndryshoFjalekalimin) return;
    var fjalekalimiRi = $('cloudFjalekalimiRi').value;
    if (!fjalekalimiRi) { $('cloudNdryshoGabimHint').textContent = T('cloudPlotesoFjalekalimin'); return; }
    if (!fjalekalimiEshteVlefshem(fjalekalimiRi)) { $('cloudNdryshoGabimHint').textContent = T('cloudFjalekalimiIShkurter'); return; }
    $('cloudNdryshoGabimHint').textContent = '';
    var rez = await window.__stokuCloud.ndryshoFjalekalimin(fjalekalimiRi);
    if (!rez.ok) { $('cloudNdryshoGabimHint').textContent = tekstiGabimitCloud(rez.kodi); return; }
    $('cloudFjalekalimiRi').value = '';
    toast(T('cloudFjalekalimiURiNdryshuar'));
  });

  $('cloudDilBtn').addEventListener('click', async function () {
    var po = await konfirmo(T('cloudTeDilet'), T('cloudDilTekst'), T('cloudDilBtn'));
    if (!po) return;
    if (window.__stokuCloud && window.__stokuCloud.dil) await window.__stokuCloud.dil();
    rifreskoDukjenECloud();
  });

  // ---------- Lista + kërkimi ----------
  function renderLista() {
    if (folderiAktual === null) return;
    var k = $('kerko').value.trim().toLowerCase();
    var te = produktetENjeFolderi(folderiAktual);
    te.sort(krahaso);

    $('titulli').textContent = emriFolderit(folderiAktual) + ' (' + T('njesiaProdukteve', { n: te.length }) + ')';
    $('btnFshiTeGjitha').disabled = te.length === 0;

    var fil = te;
    if (k) {
      fil = te.filter(function (p) {
        return p.emri.toLowerCase().indexOf(k) !== -1 || p.barkodi.toLowerCase().indexOf(k) !== -1;
      });
    }

    var lista = $('lista');
    lista.textContent = '';
    var frag = document.createDocumentFragment();

    if (fil.length === 0 && k) {
      var i0 = document.createElement('div');
      i0.className = 'info';
      i0.textContent = T('nukUGjetAsnjeProdukt');
      frag.appendChild(i0);
    }

    fil.slice(0, LIMIT_RENDER).forEach(function (p) {
      var rreshti = document.createElement('div');
      rreshti.className = 'artikull';
      var majtas = document.createElement('div');
      majtas.className = 'majtas';
      var emri = document.createElement('div');
      emri.className = 'emri';
      emri.textContent = p.emri || T('paEmerListe');
      if (!p.emri) emri.className = 'emri bosh';
      var kodi = document.createElement('div');
      kodi.className = 'kodi';
      kodi.textContent = p.barkodi;
      majtas.appendChild(emri);
      majtas.appendChild(kodi);
      var sasia = document.createElement('div');
      sasia.className = 'sasia';
      sasia.textContent = String(p.sasia);
      rreshti.appendChild(majtas);
      rreshti.appendChild(sasia);
      rreshti.addEventListener('click', function () {
        burimiIFundit = 'lista';
        hapDialogun(p.barkodi);
      });
      frag.appendChild(rreshti);
    });

    if (fil.length > LIMIT_RENDER) {
      var i1 = document.createElement('div');
      i1.className = 'info';
      i1.textContent = T('shfaqenNga', { limit: LIMIT_RENDER, gjithsej: fil.length });
      frag.appendChild(i1);
    }
    lista.appendChild(frag);
  }

  // ---------- Dialogu i produktit ----------
  var burimiIFundit = 'fushe'; // 'fushe' (scanner/tastierë), 'kamera' ose 'lista'
  var dialogu = null;          // { barkodi, ekzistues }

  function hapDialogun(barkodi) {
    if (folderiAktual === null) return;
    var e = produktet[celesiProduktit(folderiAktual, barkodi)] || null;
    dialogu = { barkodi: barkodi, ekzistues: e };
    var paEmer = opsione.paEmer;
    $('dlgTitulli').textContent = e ? T('produktiEkziston', { sasia: e.sasia }) : (paEmer ? T('produktIRiPaEmer') : T('produktIRi'));
    $('dlgKodi').textContent = T('barkodiEtiketa', { barkodi: barkodi }) + ((paEmer && e && e.emri) ? '\n' + T('emriEtiketa', { emri: e.emri }) : '');
    $('fushaEmri').style.display = paEmer ? 'none' : '';
    $('dlgEmri').value = e ? e.emri : '';
    $('dlgSasia').value = '';
    $('dlgSasiaLabel').textContent = e ? T('sasiaPerTuShtuar') : T('sasia');
    $('dlgFshij').style.display = e ? '' : 'none';
    $('dlgZhvendosBtn').style.display = e ? 'block' : 'none';
    $('dlgProdukt').classList.add('hapur');
    ((e || paEmer) ? $('dlgSasia') : $('dlgEmri')).focus();
  }

  function mbyllDialogun() {
    $('dlgProdukt').classList.remove('hapur');
    dialogu = null;
    if (opsione.pda || (burimiIFundit === 'fushe' && opsione.scanner)) {
      // kthe fokusin te fusha e barkodit (për skanerin e jashtëm)
      $('barkodi').focus();
    } else {
      document.activeElement && document.activeElement.blur && document.activeElement.blur();
    }
  }

  function ruajProduktin() {
    if (!dialogu) return;
    var emri = opsione.paEmer ? (dialogu.ekzistues ? dialogu.ekzistues.emri : '') : $('dlgEmri').value.trim();
    var tekstSasia = $('dlgSasia').value.trim();
    if (!opsione.paEmer && !emri) { toast(T('shkruajEmrin')); $('dlgEmri').focus(); return; }
    if (!/^-?\d+$/.test(tekstSasia)) { toast(T('shkruajSasine')); $('dlgSasia').focus(); return; }
    var sasia = parseInt(tekstSasia, 10);
    var e = dialogu.ekzistues;
    var total = (e ? e.sasia : 0) + sasia;
    produktet[celesiProduktit(folderiAktual, dialogu.barkodi)] =
      { barkodi: dialogu.barkodi, emri: emri, sasia: total, kategoriaId: folderiAktual, prekurSe: Date.now() };
    ruajBaze();
    mbyllDialogun();
    renderLista();
    renderFolderat();
  }

  function fshijProduktin() {
    if (!dialogu || !dialogu.ekzistues) return;
    delete produktet[celesiProduktit(folderiAktual, dialogu.barkodi)];
    shenoProduktinEFshire(celesiProduktit(folderiAktual, dialogu.barkodi));
    ruajBaze();
    mbyllDialogun();
    renderLista();
    renderFolderat();
  }

  // ---------- Zhvendos produktin në folder tjetër ----------
  function hapZhvendosin() {
    if (!dialogu || !dialogu.ekzistues) return;
    var teTjerat = foldera.filter(function (f) { return f.id !== folderiAktual; });
    $('zhvendosHint').textContent = T('zhvendosHint', { emri: dialogu.ekzistues.emri || dialogu.barkodi });

    var cont = $('zhvendosLista');
    cont.textContent = '';
    if (teTjerat.length === 0) {
      var i0 = document.createElement('div');
      i0.className = 'info';
      i0.textContent = T('zhvendosAsnjeFolder');
      cont.appendChild(i0);
    } else {
      teTjerat.forEach(function (f) {
        var rr = document.createElement('button');
        rr.type = 'button';
        rr.className = 'kategori-rresht';

        var shigjeta = document.createElement('span');
        shigjeta.className = 'shigjeta';

  function mbyllZhvendosin() { $('dlgZhvendos').classList.remove('hapur'); }

  function zhvendosProduktinNeFolderin(destinacioni) {
    if (!dialogu || !dialogu.ekzistues) return;
    var produkti = dialogu.ekzistues;
    var barkodi = dialogu.barkodi;
    var celesiVjeter = celesiProduktit(folderiAktual, barkodi);
    var celesiRi = celesiProduktit(destinacioni.id, barkodi);
    var ekzistuesNeDestinacion = produktet[celesiRi] || null;

    delete produktet[celesiVjeter];
    shenoProduktinEFshire(celesiVjeter);
    var total = (ekzistuesNeDestinacion ? ekzistuesNeDestinacion.sasia : 0) + produkti.sasia;
    var emriPerRuajtje = (ekzistuesNeDestinacion && ekzistuesNeDestinacion.emri) ? ekzistuesNeDestinacion.emri : produkti.emri;
    produktet[celesiRi] = {
      barkodi: barkodi, emri: emriPerRuajtje, sasia: total,
      kategoriaId: destinacioni.id, prekurSe: Date.now()
    };
    ruajBaze();

    mbyllZhvendosin();
    mbyllDialogun();
    renderLista();
    renderFolderat();
    toast(ekzistuesNeDestinacion
      ? T('zhvendosUBashkua', { folder: destinacioni.emri, sasia: total })
      : T('zhvendosUKry', { folder: destinacioni.emri }), 4000);
  }

  $('dlgFshij').addEventListener('click', fshijProduktin);

  // ---------- Fusha e barkodit (skaner i jashtëm / tastierë / PDA) ----------
  var pdaKohez = null;

  // Heuristikë: a duket kjo si diçka tjetër përveç barkodit të një produkti (p.sh. kod QR ose tekst i gjatë)?
  // Barkodet e produkteve janë pothuajse gjithmonë vetëm numra (6-14 shifra).
  function duketSiDiçkaTjeterVeçBarkod(tekst) {
    if (/^[0-9]{6,14}$/.test(tekst)) return false;
    if (tekst.length > 20) return true;
    if (/^https?:\/\//i.test(tekst)) return true;
    if (/\s/.test(tekst)) return true;
    return false;
  }

  function skanoBarkodin() {
    clearTimeout(pdaKohez);
    // Nëse ndërkohë është hapur një dritare tjetër (Opsionet, Eksporti, Fshirja), mos hap dialogun e produktit mbi të
    if (document.querySelector('.mbulese.hapur')) return;
    var b = $('barkodi').value.trim();
    $('barkodi').value = '';
    $('barkodiShfaqje').textContent = '';
    if (!b) return;
    if (duketSiDiçkaTjeterVeçBarkod(b)) {
      toast(T('qrDyshim'));
      return;
    }
    burimiIFundit = 'fushe';
    hapDialogun(b);
  }

  $('barkodi').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      skanoBarkodin();
    }
  });

  // Modaliteti PDA: skaneri i brendshëm shpesh nuk dërgon Enter.
  // Pasi pushon së shkruari (pak nga skaneri), hapet vetë dritarja e produktit.
  $('barkodi').addEventListener('input', function () {
    $('barkodiShfaqje').textContent = $('barkodi').value; // mban të njëjtin tekst kur tastiera është e fshehur
    clearTimeout(pdaKohez);
    if (!opsione.pda) return;
    if ($('barkodi').value.trim() === '') return;
    pdaKohez = setTimeout(skanoBarkodin, 200);
  });

  $('kerko').addEventListener('input', renderLista);

  // ---------- Tingulli (vetëm kur skanon me kamerë) ----------
  var audioCtx = null;
  function pergatitAudion() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* pa tingull */ }
  }
  function bip() {
    if (!opsione.tingull) return;
    try {
      pergatitAudion();
      if (!audioCtx) return;
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = 1800;
      g.gain.value = 0.15;
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.15);
    } catch (e) { /* pa tingull */ }
  }

  // ---------- Kamera ----------
  var skaneri = null;
  var perpunuar = false;
  var kameraAktualeId = '';

  // Kthen kamerat e pasme (pa atë të përparmen).
  // kerkoLejen = true: kërkon lejen e kamerës nëse etiketat ende s'janë të dukshme.
  async function listoKamerat(kerkoLejen) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
      return { ok: false, kamerat: [], paEtiketa: false, gabimKyc: 'kameraPaMbeshtetje' };
    }
    function vetemKamerat(pajisjet) {
      return pajisjet.filter(function (d) { return d.kind === 'videoinput'; });
    }
    try {
      var kamerat = vetemKamerat(await navigator.mediaDevices.enumerateDevices());
      var paEtiketa = kamerat.length > 0 && kamerat.every(function (k) { return !k.label; });
      if (paEtiketa && kerkoLejen) {
        // emrat e kamerave shfaqen vetëm pasi jepet leja e kamerës
        var rrjedha = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        rrjedha.getTracks().forEach(function (t) { t.stop(); });
        kamerat = vetemKamerat(await navigator.mediaDevices.enumerateDevices());
        paEtiketa = kamerat.length > 0 && kamerat.every(function (k) { return !k.label; });
      }
      var tePasme = kamerat.filter(function (k) {
        return !/front|user|selfie|përpara|frontal/i.test(k.label || '');
      }).map(function (k) { return { deviceId: k.deviceId, label: k.label || '' }; });
      return { ok: true, kamerat: tePasme, paEtiketa: paEtiketa };
    } catch (err) {
      return { ok: false, kamerat: [], paEtiketa: false, gabimKyc: 'kameraPaLeje' };
    }
  }

  // Plotëson listën e kamerave te Opsionet
  async function plotesoKamerat(kerkoLejen) {
    var sel = $('opsKamera');
    var info = $('opsKameraInfo');
    var r = await listoKamerat(kerkoLejen);
    function shto(vlera, tekst) {
      var o = document.createElement('option');
      o.value = vlera;
      o.textContent = tekst;
      sel.appendChild(o);
    }
    sel.textContent = '';
    shto('', T('automatikeKryesore'));
    if (r.ok && !r.paEtiketa) {
      r.kamerat.forEach(function (k, i) { shto(k.deviceId, (i + 1) + '. ' + (k.label || 'Kamera')); });
    }
    var ekziston = Array.prototype.some.call(sel.options, function (o) { return o.value === opsione.kameraId; });
    if (opsione.kameraId && !ekziston) shto(opsione.kameraId, T('kameraZgjedhurMore'));
    sel.value = opsione.kameraId;

    if (!r.ok) info.textContent = T(r.gabimKyc);
    else if (r.paEtiketa) info.textContent = T('kameraShtypGjej');
    else if (r.kamerat.length === 0) info.textContent = T('kameraAsnje');
    else info.textContent = T('kameraUGjeten', { n: r.kamerat.length });
  }

  function trackuIKameres() {
    var v = document.querySelector('#reader video');
    var rrjedha = v && v.srcObject;
    return (rrjedha && rrjedha.getVideoTracks && rrjedha.getVideoTracks()[0]) || null;
  }

  // Autofokus i vazhdueshëm (nëse kamera e mbështet)
  async function aplikoAutofokusin() {
    if (!opsione.autofokus) return;
    try {
      var t = trackuIKameres();
      if (!t || !t.getCapabilities) return;
      var cap = t.getCapabilities();
      if (cap && cap.focusMode && cap.focusMode.indexOf('continuous') !== -1) {
        await t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      }
    } catch (e) { /* mbetet fokusi i parazgjedhur i telefonit */ }
  }

  // Pas nisjes: autofokusi, emri i kamerës dhe butoni "Ndërro kamerën"
  async function pasNisjes() {
    try {
      await aplikoAutofokusin();
      var t = trackuIKameres();
      var cil = (t && t.getSettings) ? t.getSettings() : {};
      kameraAktualeId = cil.deviceId || '';
      var r = await listoKamerat(false);
      var aktuale = r.kamerat.filter(function (k) { return k.deviceId === kameraAktualeId; })[0];
      $('kameraEmri').textContent = aktuale ? aktuale.label : '';
      $('ndrroKamere').style.display = r.kamerat.length > 1 ? '' : 'none';
    } catch (e) { /* nuk e pengon skenimin */ }
  }

  function krijoSkanerin() {
    var F = Html5QrcodeSupportedFormats;
    return new Html5Qrcode('reader', {
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODE_93, F.ITF, F.CODABAR, F.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
  }

  // Nxjerr emrin e formatit të lexuar (p.sh. 'QR_CODE', 'EAN_13'), nëse librari e jep
  function formatiIRezultatit(decodedResult) {
    try {
      if (!decodedResult) return '';
      var f = decodedResult.result && decodedResult.result.format;
      if (f && f.formatName) return f.formatName;
      if (decodedResult.format && decodedResult.format.formatName) return decodedResult.format.formatName;
      if (typeof decodedResult.format === 'string') return decodedResult.format;
    } catch (e) { /* ok */ }
    return '';
  }

  // Nis kamerën e zgjedhur; nëse ajo nuk gjendet, kalon te kamera automatike.
  // Kutia e skenimit është ngushtë (formë "shirit"), e menduar posaçërisht për të kapur VETËM NJË
  // barkod të vetëm, edhe kur ka shumë barkode të printuara afër njëra-tjetrës (p.sh. në një fletë A4).
  async function nisKamere() {
    var konfigurimi = {
      fps: 10,
      qrbox: function (w, h) {
        return {
          width: Math.floor(Math.min(w * 0.82, 320)),
          height: Math.floor(Math.min(h * 0.22, 90))
        };
      }
    };
    var kuSuksesi = function (tekstiILexuar, decodedResult) {
      if (perpunuar) return;
      var formati = formatiIRezultatit(decodedResult);
      if (formati === 'QR_CODE') {
        // Nuk e trajtojmë si barkod produkti: njoftojmë dhe vazhdojmë skenimin pa e ndalur kamerën
        toast(T('qrRefuzuar'));
        return;
      }
      perpunuar = true;
      bip();
      ndalKamere().then(function () {
        burimiIFundit = 'kamera';
        hapDialogun(String(tekstiILexuar).trim());
      });
    };
    var kuGabimi = function () { /* gabimet e vazhdueshme të leximit shpërfillen */ };

    var provat = [];
    if (opsione.kameraId) provat.push(opsione.kameraId);
    provat.push({ facingMode: 'environment' });

    var gabimiIFundit = null;
    for (var i = 0; i < provat.length; i++) {
      skaneri = krijoSkanerin();
      try {
        await skaneri.start(provat[i], konfigurimi, kuSuksesi, kuGabimi);
        if (opsione.kameraId && i > 0) toast(T('kameraNukUGjet'), 4000);
        await pasNisjes();
        return;
      } catch (err) {
        gabimiIFundit = err;
        var e_deshtuar = skaneri;
        skaneri = null;
        try { e_deshtuar.clear(); } catch (e) { /* ok */ }
      }
    }
    throw gabimiIFundit;
  }

  async function hapKamere() {
    pergatitAudion(); // duhet thirrur nga prekja e përdoruesit që tingulli të lejohet në iPhone
    if (typeof Html5Qrcode === 'undefined') {
      toast(T('kameraNukEshteGati'));
      return;
    }
    perpunuar = false;
    $('kameraEmri').textContent = '';
    $('ndrroKamere').style.display = 'none';
    $('kamera').classList.add('hapur');
    try {
      await nisKamere();
    } catch (err) {
      await ndalKamere();
      toast(T('kameraNukUHapLeje'));
    }
  }

  // Ndalon vetëm skanerin (dritarja e kamerës mbetet e hapur)
  async function ndalSkanerin() {
    var s = skaneri;
    skaneri = null;
    if (s) {
      try { await s.stop(); } catch (e) { /* ok */ }
      try { s.clear(); } catch (e) { /* ok */ }
    }
  }

  async function ndalKamere() {
    await ndalSkanerin();
    $('kamera').classList.remove('hapur');
  }

  // Kalon te kamera e pasme tjetër (pa atë të përparmen) dhe e ruan zgjedhjen
  async function ndrroKamere() {
    var r = await listoKamerat(false);
    if (r.kamerat.length < 2) return;
    var i = -1;
    r.kamerat.forEach(function (k, j) { if (k.deviceId === kameraAktualeId) i = j; });
    var tjetra = r.kamerat[(i + 1) % r.kamerat.length];
    opsione.kameraId = tjetra.deviceId;
    ruajOpsionet();
    perpunuar = false;
    await ndalSkanerin();
    try {
      await nisKamere();
    } catch (err) {
      await ndalKamere();
      toast(T('kameraNukUHap'));
    }
  }

  $('btnKamera').addEventListener('click', hapKamere);
  $('mbyllKamere').addEventListener('click', ndalKamere);
  $('ndrroKamere').addEventListener('click', ndrroKamere);

  // ---------- Eksporti në Excel (.xlsx) ----------
  function dyShifra(n) { return (n < 10 ? '0' : '') + n; }

  function kaShare(skedari) {
    return !!(navigator.canShare && navigator.share && navigator.canShare({ files: [skedari] }));
  }

  function sluguFolderit(emri) {
    var s = String(emri).toLowerCase()
      .replace(/ë/g, 'e').replace(/ç/g, 'c')
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '');
    return s || 'folder';
  }

  // Ndërton skedarin .xlsx vetëm me produktet e folderit aktual
  function krijoSkedarin() {
    if (folderiAktual === null) return null;
    var te = produktetENjeFolderi(folderiAktual);
    if (te.length === 0) { toast(T('nukKaProdukteEksport')); return null; }
    te.sort(emriKrahaso);

    var d = new Date();
    var emri = 'malli_' + sluguFolderit(emriFolderit(folderiAktual)) + '_' +
      d.getFullYear() + '-' + dyShifra(d.getMonth() + 1) + '-' + dyShifra(d.getDate()) +
      '_' + dyShifra(d.getHours()) + dyShifra(d.getMinutes()) + '.xlsx';

    var bajtet = StokuXlsx.build(te);
    return {
      skedari: new File([bajtet], emri, { type: MIME_XLSX }),
      emri: emri,
      n: te.length
    };
  }

  // Shkarkim i zakonshëm (Android, kompjuter)
  function shkarkoDirekt(f) {
    var url = URL.createObjectURL(f.skedari);
    var a = document.createElement('a');
    a.href = url;
    a.download = f.emri;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
  }

  // Ndan (ose shkarkon) një skedar tashmë të gatshëm { skedari, emri }
  async function ndajOseShkarko(f, titulliShpernd) {
    if (kaShare(f.skedari)) {
      try {
        await navigator.share({ files: [f.skedari], title: titulliShpernd || f.emri });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return; // përdoruesi e mbylli menunë
      }
    }
    shkarkoDirekt(f);
  }

  // Butoni "Eksporto në Excel": një prekje, pa dritare zgjedhjeje
  async function eksporto() {
    var f = krijoSkedarin();
    if (!f) return;
    await ndajOseShkarko(f, 'Malli');
  }

  $('btnEksport').addEventListener('click', eksporto);

  // ---------- Eksporti në PDF (etiketa me barkod, për printim dhe riskenim) ----------
  function formatiBarkodit(b) {
    if (/^[0-9]{13}$/.test(b)) return 'EAN13';
    if (/^[0-9]{12}$/.test(b)) return 'UPC';
    if (/^[0-9]{8}$/.test(b)) return 'EAN8';
    return 'CODE128';
  }

  // Vizaton barkodin (grafik + numri poshtë tij) mbi një <canvas>; provon disa formate nëse i pari dështon
  function vizatoBarkodin(canvas, barkodi) {
    var formatet = [formatiBarkodit(barkodi)];
    if (formatet[0] !== 'CODE128') formatet.push('CODE128');
    for (var i = 0; i < formatet.length; i++) {
      try {
        window.JsBarcode(canvas, barkodi, {
          format: formatet[i], displayValue: true, fontSize: 16,
          height: 46, margin: 6, background: '#ffffff', lineColor: '#000000'
        });
        return true;
      } catch (e) { /* provo formatin tjetër */ }
    }
    return false;
  }

  function shkurtoTekstin(tekst, maks) {
    if (!tekst) return '';
    return tekst.length > maks ? tekst.slice(0, maks - 1) + '…' : tekst;
  }

  // Krijon një PDF me etiketa (barkod + numër + emër + sasi) të gjitha produktet e folderit,
  // të rregulluara në rrjetë mbi fletë A4, gati për printim dhe riskenim më vonë.
  async function eksportoPdf() {
    if (folderiAktual === null) return;
    if (typeof window.jspdf === 'undefined' || typeof window.JsBarcode === 'undefined') {
      toast(T('pdfNukGati'));
      return;
    }
    var te = produktetENjeFolderi(folderiAktual);
    if (te.length === 0) { toast(T('nukKaProdukteEksport')); return; }
    te.sort(emriKrahaso);

    var btn = $('btnEksportPdf');
    var tekstiVjeter = btn.textContent;
    btn.disabled = true;
    btn.textContent = T('pdfDukeKrijuar');

    try {
      var JsPdfKlasa = window.jspdf.jsPDF;
      var dok = new JsPdfKlasa({ unit: 'mm', format: 'a4' });

      var faqjaGj = 210, faqjaLart = 297;
      var mV = 8;
      var kolona = 3, rreshta = 8;
      var boshllek = 3;
      var qelizaGj = (faqjaGj - 2 * mV - (kolona - 1) * boshllek) / kolona;
      var qelizaLart = (faqjaLart - 2 * mV - (rreshta - 1) * boshllek) / rreshta;
      var perFaqe = kolona * rreshta;

      var canvas = document.createElement('canvas');

      te.forEach(function (p, idx) {
        var poz = idx % perFaqe;
        if (idx > 0 && poz === 0) dok.addPage();
        var kol = poz % kolona;
        var rr = Math.floor(poz / kolona);
        var x = mV + kol * (qelizaGj + boshllek);
        var y = mV + rr * (qelizaLart + boshllek);

        dok.setDrawColor(210);
        dok.rect(x, y, qelizaGj, qelizaLart);

        var uKrijua = vizatoBarkodin(canvas, p.barkodi);
        var qendraX = x + qelizaGj / 2;

        if (uKrijua) {
          var barkodiGj = qelizaGj - 4;
          var barkodiLart = barkodiGj * (canvas.height / canvas.width);
          var maksLart = qelizaLart * 0.6;
          if (barkodiLart > maksLart) barkodiLart = maksLart;
          var imgX = x + (qelizaGj - barkodiGj) / 2;
          dok.addImage(canvas.toDataURL('image/png'), 'PNG', imgX, y + 2, barkodiGj, barkodiLart);

          var yTeksti = y + 2 + barkodiLart + 4;
          dok.setFont('helvetica', 'normal');
          dok.setFontSize(8);
          dok.setTextColor(20, 20, 20);
          dok.text(shkurtoTekstin(p.emri || T('paEmerListe'), 28), qendraX, yTeksti, { align: 'center' });
          dok.setFont('helvetica', 'bold');
          dok.setFontSize(9);
          dok.text(T('sasia') + ': ' + p.sasia, qendraX, yTeksti + 5, { align: 'center' });
        } else {
          dok.setFont('helvetica', 'normal');
          dok.setFontSize(9);
          dok.text(p.barkodi, qendraX, y + qelizaLart / 2, { align: 'center' });
        }
      });

      var d = new Date();
      var emriSkedarit = 'etiketa_' + sluguFolderit(emriFolderit(folderiAktual)) + '_' +
        d.getFullYear() + '-' + dyShifra(d.getMonth() + 1) + '-' + dyShifra(d.getDate()) + '.pdf';
      var bajtet = dok.output('arraybuffer');
      var skedari = new File([bajtet], emriSkedarit, { type: 'application/pdf' });
      await ndajOseShkarko({ skedari: skedari, emri: emriSkedarit }, 'Etiketa');
    } catch (err) {
      toast(T('pdfDeshtoi'));
    } finally {
      btn.disabled = false;
      btn.textContent = tekstiVjeter;
    }
  }

  $('btnEksportPdf').addEventListener('click', eksportoPdf);

  // ---------- Fshirja e të gjithave (me pritje 10 sekonda) ----------
  var kohezues = null;

  function hapFshirjen() {
    if (folderiAktual === null) return;
    var n = produktetENjeFolderi(folderiAktual).length;
    if (!n) return;
    $('fshiTitulli').textContent = T('teFshihenTeGjitha');
    $('fshiTekst').textContent = T('fshirjaTekst', { n: n, folder: emriFolderit(folderiAktual) });
    var s = 10;
    var btn = $('fshiKonfirmo');
    btn.disabled = true;
    btn.textContent = T('fshiKrejt') + ' (' + s + ')';
    $('dlgFshirje').classList.add('hapur');
    clearInterval(kohezues);
    kohezues = setInterval(function () {
      s--;
      if (s > 0) {
        btn.textContent = T('fshiKrejt') + ' (' + s + ')';
      } else {
        clearInterval(kohezues);
        btn.disabled = false;
        btn.textContent = T('fshiKrejt');
      }
    }, 1000);
  }

  function mbyllFshirjen() {
    clearInterval(kohezues);
    $('dlgFshirje').classList.remove('hapur');
    fokusoBarkodin();
  }

  $('btnFshiTeGjitha').addEventListener('click', hapFshirjen);
  $('fshiAnulo').addEventListener('click', mbyllFshirjen);
  $('dlgFshirje').addEventListener('click', function (ev) {
    if (ev.target === $('dlgFshirje')) mbyllFshirjen(); // prekja jashtë = anulim
  });
  $('fshiKonfirmo').addEventListener('click', function () {
    if ($('fshiKonfirmo').disabled) return;
    if (folderiAktual === null) return;
    produktetENjeFolderi(folderiAktual).forEach(function (p) {
      delete produktet[celesiProduktit(folderiAktual, p.barkodi)];
      shenoProduktinEFshire(celesiProduktit(folderiAktual, p.barkodi));
    });
    ruajBaze();
    mbyllFshirjen();
    renderLista();
    renderFolderat();
    toast(T('uFshinePrejFolderit'));
  });

  // ---------- Tips & Tricks (ekrani kryesor) ----------
  var TIPAT_KYC = ['tipi01', 'tipi02', 'tipi03', 'tipi04', 'tipi05', 'tipi06',
    'tipi07', 'tipi08', 'tipi09', 'tipi10', 'tipi11', 'tipi12'];
  var tipiIndeksi = Math.floor(Math.random() * TIPAT_KYC.length);
  var tipiIFshehur = false;

  function renderTipin() {
    $('tipiTeksti').textContent = T(TIPAT_KYC[tipiIndeksi]);
  }
  $('tipiTjetri').addEventListener('click', function () {
    tipiIndeksi = (tipiIndeksi + 1) % TIPAT_KYC.length;
    renderTipin();
  });
  $('tipiMbyll').addEventListener('click', function () {
    tipiIFshehur = true;
    $('tipiMbeshtjellje').style.display = 'none';
  });
  renderTipin();

  // ---------- Service worker (punon edhe pa internet) ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* ok */ });
    });
  }

  rifreskoPamjen();
})();
</script>

<!-- Firebase (Cloud): modul i vetëm, ekspozon window.__stokuCloud për skriptin kryesor.
     Hyrje me emër përdoruesi + fjalëkalim (pa email): emri shndërrohet në një "email" të brendshëm
     (emri@stoku-app.local) vetëm që Firebase Auth ta pranojë; përdoruesi asnjëherë s'e sheh a s'e fut email. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    updateEmail, updatePassword
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyCttsCATjbQQ8LaspIb1BnFrsnzusKy6IY",
    authDomain: "stoku-appi.firebaseapp.com",
    projectId: "stoku-appi",
    storageBucket: "stoku-appi.firebasestorage.app",
    messagingSenderId: "107114545225",
    appId: "1:107114545225:web:f3944cd32f4e772577bf98"
  };

  function emailIBrendshem(emriPerdoruesit) {
    return emriPerdoruesit.trim().toLowerCase() + '@stoku-app.local';
  }

  try {
    var app = initializeApp(firebaseConfig);
    var auth = getAuth(app);
    var db = getFirestore(app);

    window.__stokuCloud = {
      async regjistrohu(emriPerdoruesit, fjalekalimi) {
        try {
          var kred = await createUserWithEmailAndPassword(auth, emailIBrendshem(emriPerdoruesit), fjalekalimi);
          return { ok: true, uid: kred.user.uid };
        } catch (e) {
          return { ok: false, kodi: e && e.code, arsye: String((e && e.message) || e) };
        }
      },
      async hyr(emriPerdoruesit, fjalekalimi) {
        try {
          var kred = await signInWithEmailAndPassword(auth, emailIBrendshem(emriPerdoruesit), fjalekalimi);
          return { ok: true, uid: kred.user.uid };
        } catch (e) {
          return { ok: false, kodi: e && e.code, arsye: String((e && e.message) || e) };
        }
      },
      async dil() {
        try { await signOut(auth); } catch (e) { /* ok */ }
      },
      async ndryshoEmrin(emriRiPerdoruesit) {
        if (!auth.currentUser) return { ok: false, arsye: 'pa-hyrje' };
        try {
          await updateEmail(auth.currentUser, emailIBrendshem(emriRiPerdoruesit));
          return { ok: true };
        } catch (e) {
          return { ok: false, kodi: e && e.code, arsye: String((e && e.message) || e) };
        }
      },
      async ndryshoFjalekalimin(fjalekalimiRi) {
        if (!auth.currentUser) return { ok: false, arsye: 'pa-hyrje' };
        try {
          await updatePassword(auth.currentUser, fjalekalimiRi);
          return { ok: true };
        } catch (e) {
          return { ok: false, kodi: e && e.code, arsye: String((e && e.message) || e) };
        }
      },
      perdoruesiAktual() {
        return auth.currentUser;
      },
      async ruaj(gjendja) {
        if (!auth.currentUser) return { ok: false, arsye: 'pa-hyrje' };
        try {
          await setDoc(doc(db, 'dyqane', auth.currentUser.uid), gjendja);
          return { ok: true };
        } catch (e) {
          return { ok: false, arsye: String((e && e.message) || e) };
        }
      },
      async merr() {
        if (!auth.currentUser) return { ok: false, arsye: 'pa-hyrje' };
        try {
          var rez = await getDoc(doc(db, 'dyqane', auth.currentUser.uid));
          return { ok: true, gjendja: rez.exists() ? rez.data() : null };
        } catch (e) {
          return { ok: false, arsye: String((e && e.message) || e) };
        }
      }
    };

    onAuthStateChanged(auth, function () {
      window.dispatchEvent(new Event('stoku-auth-ndryshoi'));
    });
  } catch (e) {
    window.__stokuCloud = null; // p.sh. pa internet — app-i vazhdon të punojë vetëm lokalisht
  }

  window.dispatchEvent(new Event('stoku-cloud-gati'));
</script>
</body>
