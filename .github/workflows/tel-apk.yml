# Ndërton aplikacionin Stoku për telefon (Android) dhe e vendos APK-në si "artifact"
# dhe, në main, si Release (shkarkohet nga faqja e Releases në GitHub).
name: Stoku Tel APK

on:
  push:
    paths:
      - 'tel/**'
      - '!tel/**/*.md' # vetëm dokumentimi: pa APK të re (përndryshe çdo aplikacion ofronte "version të ri" të njëjtë)
      - '.github/workflows/tel-apk.yml'
      - '.github/apk/nenshkruaj.sh'
  workflow_dispatch:

# Ndërtimi lexon vetëm; leja për të shkruar (Release) i jepet vetëm hapit të publikimit, në main, pa kodin e projektit
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ndërto APK
        run: gradle -p tel assembleRelease --stacktrace --no-daemon
      # Me vulën e re (pasi ta krijojë apk-celesat.yml një herë): v3 + zinxhiri i ndërrimit; pa të: si e nënshkroi Gradle-i
      - name: Nënshkrimi
        env:
          P: ${{ secrets.APK_FJALEKALIMI }}
        run: bash .github/apk/nenshkruaj.sh tel tel/app/build/outputs/apk/release/app-release.apk stoku-tel-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stoku-tel-apk
          path: stoku-tel-${{ github.run_number }}.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stoku-tel-apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tel-v${{ github.run_number }}
          name: Stoku për telefon (Android) ${{ github.run_number }}
          body: Aplikacioni Stoku për telefon Android. Instalohet një herë; versionet e reja i ofron vetë aplikacioni. Udhëzimi te tel/README.md.
          files: stoku-tel-${{ github.run_number }}.apk
