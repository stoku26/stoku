# E PËRKOHSHME (hiqet para merge): provon skriptet e vulës me çelësa të rremë që krijohen dhe fshihen këtu,
# pastaj përditësimin në Android të emuluar (API 27 = Android 8.1, API 30 = Android 11).
name: Provë e vulës së re të APK-ve

on:
  push:
    branches: [claude/qysh-funksionon-ilbmdw]
    paths:
      - '.github/workflows/provo-celesat.yml'
      - '.github/apk/**'

permissions:
  contents: read

jobs:
  nenshkrimi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ndërto telefonin dhe orën
        run: |
          gradle -p tel assembleRelease --no-daemon -q
          gradle -p ora assembleRelease --no-daemon -q
      - name: Provat e skripteve
        run: |
          set -euo pipefail
          T=tel/app/build/outputs/apk/release/app-release.apk
          O=ora/app/build/outputs/apk/release/app-release.apk
          mkdir -p dalja
          cp "$T" dalja/tel-vjeter.apk
          echo "== 1. pa vulë të re: APK-ja mbetet ashtu siç është"
          bash .github/apk/nenshkruaj.sh tel "$T" dalja/tel-pa.apk
          cmp "$T" dalja/tel-pa.apk
          echo "== 2. sekret i shkurtër: refuzohet"
          if P=shkurt bash .github/apk/celesat.sh; then echo "::error::pranoi sekret të shkurtër"; exit 1; fi
          echo "== 3. vula e re (e rreme, vetëm për provë)"
          export P="$(openssl rand -base64 33)"
          echo "::add-mask::$P"
          bash .github/apk/celesat.sh
          echo "== 4. s'krijohet dy herë"
          if bash .github/apk/celesat.sh; then echo "::error::u krijua dy herë"; exit 1; fi
          echo "== 5. nënshkrimi me zinxhir"
          bash .github/apk/nenshkruaj.sh tel "$T" dalja/tel-ri.apk
          bash .github/apk/nenshkruaj.sh ora "$O" dalja/ora-ri.apk
          echo "== 6. pa sekret: dështon"
          if P= bash .github/apk/nenshkruaj.sh tel "$T" dalja/x.apk; then echo "::error::u nënshkrua pa sekret"; exit 1; fi
          AS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          echo "== tel si e sheh Android 8 (API 26-27):"
          "$AS" verify --print-certs --min-sdk-version 26 --max-sdk-version 27 dalja/tel-ri.apk
          echo "== tel si e sheh Android 9+:"
          "$AS" verify --print-certs --min-sdk-version 28 dalja/tel-ri.apk
          echo "== ora:"
          "$AS" verify --print-certs dalja/ora-ri.apk
          echo "== zinxhiri brenda tel-ri.apk:"
          "$AS" lineage --in dalja/tel-ri.apk --print-certs -v
          echo "== zinxhiri i ruajtur (aftësitë e çelësit të vjetër):"
          "$AS" lineage --in tel/celesi.lineage --print-certs -v
      - uses: actions/upload-artifact@v4
        with:
          name: apk-prova
          path: dalja/
          retention-days: 1

  emulatori:
    needs: nenshkrimi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [27, 30]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-prova
          path: dalja
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Skripti i provës
        run: |
          cat > prova.sh <<'FUND'
          set -u
          instalo() { r="$(adb install -r "$1" 2>&1)"; echo "$r"; echo "$r" | grep -q '^Success'; }
          api="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "Android API $api"
          instalo dalja/tel-vjeter.apk || { echo "GABIM: s'u instalua versioni me çelësin e vjetër"; exit 1; }
          echo "== 1. përditësimi me vulën e re (duhet të pranohet)"
          instalo dalja/tel-ri.apk || { echo "GABIM: s'u pranua përditësimi me vulën e re"; exit 1; }
          echo "== 2. APK me vetëm çelësin e vjetër, sipër versionit të ri"
          if instalo dalja/tel-vjeter.apk; then
            if [ "$api" -ge 28 ]; then echo "GABIM: Android API $api e pranoi çelësin e vjetër"; exit 1; fi
            echo "OK: Android API $api (8.x) s'e njeh zinxhirin, siç pritej"
          else
            if [ "$api" -lt 28 ]; then echo "GABIM: Android API $api e refuzoi"; exit 1; fi
            echo "OK: Android API $api e refuzoi çelësin e vjetër"
          fi
          echo "== 3. përditësimi i radhës me vulën e re (duhet të pranohet)"
          instalo dalja/tel-ri.apk || { echo "GABIM: s'u pranua sërish vula e re"; exit 1; }
          echo "FUND: krejt në rregull"
          FUND
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash prova.sh
