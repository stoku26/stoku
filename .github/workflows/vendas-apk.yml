# Ndërton aplikacionin Stoku për Android (vendas/, pa WebView): provon logjikën (vendas/logjika, e njëjtë me web-in) dhe e vendos
# APK-në si "artifact"; në main edhe si Release "vendas-vNN" (aplikacioni e gjen vetë versionin e ri).
name: Stoku APK

on:
  push:
    paths:
      - 'vendas/**'
      - '!vendas/**/*.md'
      - '.github/workflows/vendas-apk.yml'
      - '.github/apk/nenshkruaj.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Provo logjikën (bashkimi, ruajtja, afatet, lejet = web-i)
        run: gradle -p vendas :logjika:test --stacktrace --no-daemon
      - name: Ndërto APK
        run: gradle -p vendas :app:assembleRelease --stacktrace --no-daemon
      # Me vulën e re të tel/ (v3 + zinxhiri i ndërrimit), si aplikacioni tel/
      - name: Nënshkrimi
        env:
          P: ${{ secrets.APK_FJALEKALIMI }}
        run: bash .github/apk/nenshkruaj.sh tel vendas/app/build/outputs/apk/release/app-release.apk stoku-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stoku-apk
          path: stoku-${{ github.run_number }}.apk

  # Pamjet e ekraneve (Robolectric, pa telefon) vetëm në degët e punës: çdo PNG ruhet si blob i git-it (pa prekur asnjë degë)
  # dhe "sha"-të dalin si shënim (annotation), që të lexohen me API-në e GitHub-it dhe të krahasohen me pamjet e web-it.
  pamjet:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pamjet (Robolectric)
        continue-on-error: true
        run: gradle -p vendas :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Blob-et e pamjeve
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, glob, json, os, re, urllib.request
          tok = os.environ['GH_TOKEN']; repo = os.environ['GITHUB_REPOSITORY']
          dalja = []
          for f in sorted(glob.glob('vendas/app/build/pamjet/*.png')):
              trupi = json.dumps({'content': base64.b64encode(open(f, 'rb').read()).decode(), 'encoding': 'base64'}).encode()
              k = urllib.request.Request('https://api.github.com/repos/%s/git/blobs' % repo, data=trupi,
                  headers={'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json'})
              dalja.append(os.path.basename(f) + '=' + json.load(urllib.request.urlopen(k))['sha'])
          print('::notice title=pamjet::' + ' '.join(dalja or ['asnje']))
          gab = []
          for x in glob.glob('vendas/app/build/test-results/testDebugUnitTest/*.xml'):
              for m in re.finditer(r'<testcase name="([^"]+)"[^>]*>\s*<failure message="([^"]{0,1500})', open(x).read()):
                  gab.append(m.group(1) + ': ' + m.group(2).replace('\n', ' '))
          for g in gab[:8]:
              print('::warning title=test::' + g[:1500])
          PY

  # Kontrolli automatik i Android-it (lint) vetëm në degët e punës: gabimet dhe paralajmërimet dalin në log (nuk e ndalin CI-në)
  lint:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint
        continue-on-error: true
        run: gradle -p vendas :app:lintDebug --continue --no-daemon
      - name: Rezultatet e lint-it
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, collections
          for f in glob.glob('vendas/app/build/reports/lint-results*.xml'):
              r = ET.parse(f).getroot(); n = collections.Counter()
              for i in r.findall('issue'):
                  n[(i.get('severity'), i.get('id'))] += 1
              print('== ' + f); [print('LINT-NR', k[0], k[1], v) for k, v in sorted(n.items())]
              for i in r.findall('issue'):
                  if i.get('id') in ('Typos', 'UnusedResources', 'IconMissingDensityFolder', 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion'): continue
                  l = i.find('location')
                  loc = (l.get('file', '').split('/vendas/')[-1] + ':' + l.get('line', '')) if l is not None else ''
                  print('LINT', i.get('severity'), i.get('id'), loc, '|', (i.get('message') or '')[:300])
          PY

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stoku-apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vendas-v${{ github.run_number }}
          name: Stoku për Android ${{ github.run_number }}
          body: Aplikacioni Stoku për telefon Android. Instalohet një herë; versionet e reja i ofron vetë aplikacioni. Udhëzimi te vendas/README.md.
          files: stoku-${{ github.run_number }}.apk
