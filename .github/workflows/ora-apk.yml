# Ndërton aplikacionin Stoku për orë (Wear OS, Galaxy Watch) dhe e vendos APK-në si "artifact"
# dhe, në main, si Release (shkarkohet nga faqja e Releases në GitHub).
name: Stoku Ora APK

on:
  push:
    paths:
      - 'ora/**'
      - '!ora/**/*.md' # vetëm dokumentimi: pa APK të re (përndryshe çdo aplikacion ofronte "version të ri" të njëjtë)
      - '.github/workflows/ora-apk.yml'
      - '.github/apk/nenshkruaj.sh'
      - '.github/apk/aab.sh'
  workflow_dispatch:

# Ndërtimi lexon vetëm; leja për të shkruar (Release) i jepet vetëm hapit të publikimit, në main, pa kodin e projektit
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Ndërto APK
        run: gradle -p ora :app:assembleGithubRelease --stacktrace --no-daemon
      # Me vulën e re (pasi ta krijojë apk-celesat.yml një herë): v3 + zinxhiri i ndërrimit; pa të: si e nënshkroi Gradle-i
      - name: Nënshkrimi
        env:
          P: ${{ secrets.APK_FJALEKALIMI }}
        run: bash .github/apk/nenshkruaj.sh ora ora/app/build/outputs/apk/github/release/app-github-release.apk stoku-ora-${{ github.run_number }}.apk
      # Google Play (pronari 26.11.2026): ora si AAB te i njëjti aplikacion si telefoni (paketa app.stoku.android), e nënshkruar me të
      # njëjtin "çelës ngarkimi" si AAB-ja e telefonit (aab.sh: tel/celesi-i-ri.p12.enc); te Play Console shkon te "Wear OS"
      - name: Ndërto AAB për Google Play (ora)
        run: gradle -p ora :app:bundlePlayRelease --stacktrace --no-daemon
      - name: Nënshkrimi i AAB-së së orës (çelësi i ngarkimit)
        env:
          P: ${{ secrets.APK_FJALEKALIMI }}
        run: bash .github/apk/aab.sh ora/app/build/outputs/bundle/playRelease/app-play-release.aab stoku-ora-play-${{ github.run_number }}.aab
      - uses: actions/upload-artifact@v5
        with:
          name: stoku-ora-apk
          path: stoku-ora-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v5
        with:
          name: stoku-ora-play-aab
          path: stoku-ora-play-${{ github.run_number }}.aab

  # Pamjet e orës për Google Play (Robolectric, pa orë), vetëm në degët e punës: çdo PNG ruhet si blob i git-it dhe "sha"-të dalin si
  # shënim (si te vendas-apk.yml), që të merren me API-në e GitHub-it
  pamjet:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Pamjet e orës (Robolectric)
        run: gradle -p ora :app:testGithubDebugUnitTest --stacktrace --no-daemon
      - name: Blob-et e pamjeve
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, glob, json, os, urllib.request
          tok = os.environ['GH_TOKEN']; repo = os.environ['GITHUB_REPOSITORY']
          dalja = []
          for f in sorted(glob.glob('ora/app/build/pamjet/*.png')):
              trupi = json.dumps({'content': base64.b64encode(open(f, 'rb').read()).decode(), 'encoding': 'base64'}).encode()
              k = urllib.request.Request('https://api.github.com/repos/%s/git/blobs' % repo, data=trupi,
                  headers={'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json'})
              dalja.append(os.path.basename(f) + '=' + json.load(urllib.request.urlopen(k))['sha'])
          print('::notice title=pamjet ora::' + (' '.join(dalja) or 'asnje'))
          PY

  # Kontrolli automatik i Android-it (lint) vetëm në degët e punës: gabimet dhe paralajmërimet dalin në log (nuk e ndalin CI-në)
  lint:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Lint
        continue-on-error: true
        run: gradle -p ora :app:lintDebug --continue --no-daemon
      - name: Rezultatet e lint-it
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, collections
          for f in glob.glob('ora/app/build/reports/lint-results*.xml'):
              r = ET.parse(f).getroot(); n = collections.Counter()
              for i in r.findall('issue'):
                  n[(i.get('severity'), i.get('id'))] += 1
              print('== ' + f); [print('LINT-NR', k[0], k[1], v) for k, v in sorted(n.items())]
              for i in r.findall('issue'):
                  if i.get('id') in ('Typos', 'UnusedResources', 'IconMissingDensityFolder', 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion'): continue
                  l = i.find('location')
                  loc = (l.get('file', '').split('/ora/')[-1] + ':' + l.get('line', '')) if l is not None else ''
                  print('LINT', i.get('severity'), i.get('id'), loc, '|', (i.get('message') or '')[:300])
          PY

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PLAY_SA: ${{ secrets.PLAY_SA_JSON }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: stoku-ora-apk
      - uses: actions/download-artifact@v5
        with:
          name: stoku-ora-play-aab
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ora-v${{ github.run_number }}
          name: Stoku për orë ${{ github.run_number }}
          body: Aplikacioni Stoku për Galaxy Watch (Wear OS). Instalimi përshkruhet te ora/README.md. Për Google Play (Wear OS, i njëjti aplikacion si telefoni) ngarkohet stoku-ora-play-NN.aab.
          files: |
            stoku-ora-${{ github.run_number }}.apk
            stoku-ora-play-${{ github.run_number }}.aab
      # Google Play automatikisht (pronari 27.11.2026: "kur boj updates me i qit automatikisht"): AAB-ja ngarkohet vetë te Play Console me
      # service account-in (sekreti PLAY_SA_JSON). Pa sekretin hapi kalohet (ngarkimi mbetet me dorë). Track-u: ndryshorja PLAY_TRACK e repo-s
      # (internal, alpha, production...; pa të = internal). Kur aplikacioni s'është publikuar ende asnjëherë, Play pranon vetëm "draft":
      # atëherë provohet sërish si draft dhe pronari e shtyp vetë "Save and publish". Udhëzimi: vendas/PLAY.md.
      - name: Google Play (ora)
        id: play
        if: env.PLAY_SA != ''
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SA_JSON }}
          packageName: app.stoku.android
          releaseFiles: stoku-ora-play-${{ github.run_number }}.aab
          track: wear:${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
      - name: Google Play (ora, si draft)
        if: env.PLAY_SA != '' && steps.play.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SA_JSON }}
          packageName: app.stoku.android
          releaseFiles: stoku-ora-play-${{ github.run_number }}.aab
          track: wear:${{ vars.PLAY_TRACK || 'internal' }}
          status: draft
