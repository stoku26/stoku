# Ndërton aplikacionin Stoku për orë (Wear OS, Galaxy Watch) dhe e vendos APK-në si "artifact"
# dhe, në main, si Release (shkarkohet nga faqja e Releases në GitHub).
name: Stoku Ora APK

on:
  push:
    paths:
      - 'ora/**'
      - '!ora/**/*.md' # vetëm dokumentimi: pa APK të re (përndryshe çdo aplikacion ofronte "version të ri" të njëjtë)
      - '.github/workflows/ora-apk.yml'
      - '.github/apk/nenshkruaj.sh'
  workflow_dispatch:

# Ndërtimi lexon vetëm; leja për të shkruar (Release) i jepet vetëm hapit të publikimit, në main, pa kodin e projektit
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ndërto APK
        run: gradle -p ora assembleRelease --stacktrace --no-daemon
      # Me vulën e re (pasi ta krijojë apk-celesat.yml një herë): v3 + zinxhiri i ndërrimit; pa të: si e nënshkroi Gradle-i
      - name: Nënshkrimi
        env:
          P: ${{ secrets.APK_FJALEKALIMI }}
        run: bash .github/apk/nenshkruaj.sh ora ora/app/build/outputs/apk/release/app-release.apk stoku-ora-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stoku-ora-apk
          path: stoku-ora-${{ github.run_number }}.apk

  # Kontrolli automatik i Android-it (lint) vetëm në degët e punës: gabimet dhe paralajmërimet dalin në log (nuk e ndalin CI-në)
  lint:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint
        continue-on-error: true
        run: gradle -p ora :app:lintDebug --continue --no-daemon
      - name: Rezultatet e lint-it
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, collections
          for f in glob.glob('ora/app/build/reports/lint-results*.xml'):
              r = ET.parse(f).getroot(); n = collections.Counter()
              for i in r.findall('issue'):
                  n[(i.get('severity'), i.get('id'))] += 1
              print('== ' + f); [print('LINT-NR', k[0], k[1], v) for k, v in sorted(n.items())]
              for i in r.findall('issue'):
                  if i.get('id') in ('Typos', 'UnusedResources', 'IconMissingDensityFolder', 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion'): continue
                  l = i.find('location')
                  loc = (l.get('file', '').split('/ora/')[-1] + ':' + l.get('line', '')) if l is not None else ''
                  print('LINT', i.get('severity'), i.get('id'), loc, '|', (i.get('message') or '')[:300])
          PY

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stoku-ora-apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ora-v${{ github.run_number }}
          name: Stoku për orë ${{ github.run_number }}
          body: Aplikacioni Stoku për Galaxy Watch (Wear OS). Instalimi përshkruhet te ora/README.md.
          files: stoku-ora-${{ github.run_number }}.apk
