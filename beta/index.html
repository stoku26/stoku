<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="2; url=../">
<title>Stoku</title>
<script>
  // Stoku Beta u hoq (pamja e re tani është te Stoku): çregjistro service worker-in e betës dhe kthehu te Stoku
  (function () {
    try { sessionStorage.removeItem('stoku:beta-tel'); } catch (e) { /* ok */ }
    function kthehu() { location.replace('../'); }
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (rr) {
          return Promise.all(rr.filter(function (r) { return r.scope.indexOf('/beta/') !== -1; }).map(function (r) { return r.unregister(); }));
        }).then(kthehu, kthehu);
        setTimeout(kthehu, 1500);
        return;
      }
    } catch (e) { /* ok */ }
    kthehu();
  })();
</script>
</head>
<body style="font-family:system-ui,sans-serif;background:#f6f5f2;color:#14161b;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
<p>Pamja e re tani është te <a href="../">Stoku</a>.</p>
</body>
</html>
